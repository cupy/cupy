# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The actual docs are built by the GHA `Docs: Build and publish` workflow,
# which chains off `CI` via workflow_run and uploads a `docs-html-<sha>`
# artifact. This config overrides RTD's default build so the RTD runner
# does nothing but fetch that artifact and expose it as the published HTML.
# `CUPY_CI_GITHUB_TOKEN` must be set in the RTD project environment variables
# (a fine-grained PAT scoped to cupy/cupy with `actions:read` + `metadata:read`);
# the shell block below exports it as `GH_TOKEN` so `gh` picks it up.
#
# RTD runs each build.commands entry under dash (/bin/sh), not bash, so we
# `set -eu` (no -o pipefail) and download tarballs to a file instead of
# piping. Exit 183 is RTD's "cancel this build" signal; we use it so the
# webhook-triggered build that fires before docs.yml finishes shows as
# "Cancelled" rather than failing red.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - |
      set -eu
      export GH_TOKEN="${CUPY_CI_GITHUB_TOKEN}"
      if [ "${READTHEDOCS_VERSION_TYPE}" = "external" ]; then
          SUFFIX="pr${READTHEDOCS_VERSION}-${READTHEDOCS_GIT_COMMIT_HASH}"
      else
          SUFFIX="${READTHEDOCS_GIT_COMMIT_HASH}"
      fi
      ARTIFACT_NAME="docs-html-${SUFFIX}"
      curl -fsSL -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v2.63.0/gh_2.63.0_linux_amd64.tar.gz
      tar xzf /tmp/gh.tgz -C /tmp
      export PATH="/tmp/gh_2.63.0_linux_amd64/bin:${PATH}"
      mkdir -p "${READTHEDOCS_OUTPUT}/html"
      gh api "/repos/cupy/cupy/actions/artifacts?name=${ARTIFACT_NAME}" --jq ".artifacts | sort_by(.created_at) | last.workflow_run.id // empty" > /tmp/run_id.txt
      RUN_ID=$(cat /tmp/run_id.txt)
      if [ -z "${RUN_ID}" ]; then
          echo "No ${ARTIFACT_NAME} artifact in cupy/cupy yet; cancelling build" >&2
          exit 183
      fi
      gh run download -R cupy/cupy "${RUN_ID}" -n "${ARTIFACT_NAME}" --dir "${READTHEDOCS_OUTPUT}/html"
