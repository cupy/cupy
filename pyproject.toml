[build-system]
# Need to be installed manually when using `--no-build-isolation`.
# Keep in sync with `docs/source/contribution.rst`.
requires = ["setuptools>=77", "wheel", "Cython>=3.2,<3.3", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
# Default (CUDA / HIP / CPU-stub) distribution name. PEP 621 forbids a dynamic
# `name`, so the Ascend build renames itself to `numpy-ascend` from `setup.py`
# (`distclass`, see `cupy_setup_build`-adjacent code there). Either way the
# *import* packages stay `cupy`/`cupyx`/`cupy_backends` — the same trick as
# scikit-learn/sklearn or opencv-python/cv2 — so existing `import cupy` code
# keeps working.
name = "numpy-ascend"
description = "NumPy & SciPy for GPU and Ascend NPU (CuPy-compatible)"
# Attribution policy (see NOTICE): the *distribution* is maintained by this
# fork; upstream CuPy authors hold the copyright of the derived code and are
# credited through LICENSE / NOTICE, not as authors of this metadata (an
# upstream maintainer address here would misrepresent the package's origin).
authors = [{ name = "Qingfeng Xia", email = "qingfeng.xia@hotmail.com" }]
maintainers = [{ name = "Qingfeng Xia", email = "qingfeng.xia@hotmail.com" }]
# PEP 639 SPDX string (required by `license-files` below, setuptools>=77).
# Covers the MIT root license; Apache-2.0/BSD-3/BSL-1.0 portions and their
# holders are listed in NOTICE.
license = "MIT"
license-files = ["LICENSE", "NOTICE", "docs/source/license.rst"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Cython",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
# `dependencies` / `optional-dependencies` are filled in by setup.py
# (install_requires / extras_require), see the dynamic list below.
dynamic = [
  "version",
  "readme",  # long_description
  "dependencies",  # install_requires
  "optional-dependencies",  # extras_require
]

[project.urls]
"Homepage" = "https://github.com/qingfengxia/numpy-ascend"
"Documentation" = "https://github.com/qingfengxia/numpy-ascend/tree/ascend/docs"
"Bug Tracker" = "https://github.com/qingfengxia/numpy-ascend/issues"
"Source Code" = "https://github.com/qingfengxia/numpy-ascend"

[tool.setuptools]
# Do not include files listed in MANIFEST.in to wheels.
include-package-data = false

[tool.setuptools.packages.find]
# Import packages (NOT the distribution name). Renaming the distribution to
# `numpy-ascend` on Ascend deliberately leaves these untouched, so
# `import cupy` works on every backend.
# `numpy_xpu` / `numpy_ascend` are the public import names of the Ascend
# build: ~90-line shims that alias `cupy` via sys.modules (see
# `numpy_xpu/__init__.py` / `numpy_ascend/__init__.py`). They are pruned again
# for the CUDA/HIP wheels by `_BackendAwareDistribution` in setup.py, so the
# upstream `cupy` wheel is byte-for-byte unaffected.
include = ["cupy*", "cupyx*", "cupy_backends*", "numpy_xpu", "numpy_ascend"]

[tool.setuptools.dynamic]
version = { attr = "cupy._version.__version__" }
# PyPI renders ONLY the `Description` field embedded in each artifact's
# METADATA/PKG-INFO; it never fetches README.md from the repository. `readme`
# is declared dynamic in [project] above, so it must be provided here.
# (Upstream cupy provides it via setup.py's long_description kwarg fed by the
# CUPY_INSTALL_LONG_DESCRIPTION env var, which this fork's build/CI never set
# -- that is why the published numpy-ascend release had an empty PyPI page.)
readme = { file = "README.md", content-type = "text/markdown" }

[tool.autopep8]
exclude = "*.git*, *.eggs*, *docs/source*"

[tool.autopep8.per-file-ignores]
# ignore long lines containing arrays of numerical constants
"cupyx/scipy/special/_gammainc.py" = ["E501"]

[tool.mypy]
# Keep in sync with the list in .pre-commit-config.yaml
files = ["cupy", "cupyx", "cupy_backends", ".github", ".pfnci"]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
xfail_strict = true
testpaths = "tests"
addopts = "--strict-markers"
markers = [
  "slow",
  "multi_gpu",
  "slow", "multi_gpu",
  # If pytest-timeout is not available
  "timeout",
  # If pytest-run-parallel is not available
  "parallel_threads", "iterations", "thread_unsafe",
  # 豁免 Ascend dtype 过滤 (见 tests/conftest.py::pytest_collection_modifyitems)
  "ascend_dtype_filter_off",
]
# Ascend(NPU) 不支持的 dtype (float64/complex64/complex128) 是否从测试参数化里去掉;
# auto=按后端判断(仅 Ascend 生效)。策略见 cupy/testing/_ascend_dtypes.py,
# 命令行开关 --ascend-dtype-filter={auto,on,off}。
ascend_dtype_filter = "auto"
filterwarnings = [
  "always",  # Make sure previous calls cannot hide future warnings.
  "error::FutureWarning",
  # ignore FutureWarning from cupy._util.experimental
  'ignore:.* is experimental\.:FutureWarning:cupy',
  "ignore::UserWarning",
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error::cupy.exceptions.VisibleDeprecationWarning",
  "error::cupy.exceptions.ComplexWarning",
  # distutils (vendored by setuptools)
  "ignore:The distutils(.+) is deprecated:DeprecationWarning",
  "ignore:dep_util is Deprecated:DeprecationWarning",
  # pkg_resources
  "ignore::DeprecationWarning:pkg_resources",
  "ignore:pkg_resources is deprecated",
  # Using `scipy.sparse` against NumPy 1.15+ raises warning
  # as it uses `np.matrix` which is pending deprecation.
  # Also exclude `numpy.matrixlib.defmatrix` as SciPy and our
  # test code uses `np.asmatrix`, which internally calls
  # `np.matrix`.
  'ignore::PendingDeprecationWarning:scipy\.sparse\.\w+',
  'ignore::PendingDeprecationWarning:numpy\.matrixlib\.defmatrix',
  # SciPy 1.17 announces an upcoming dtype change in
  # ``diags()`` / ``diags_array()`` via a FutureWarning when the
  # input dtype is integer.  CuPy mirrors current behaviour and
  # will adapt when SciPy actually flips the default.
  'ignore:Input has data type.*output has been cast.*:FutureWarning',
  # pyreadline (dependency from optuna -> cliff -> cmd2) uses deprecated ABCs
  "ignore:Using or importing the ABCs from:DeprecationWarning:pyreadline",
  # google-api-core>=2.28.0 warns about Python versions approaching EOL
  "ignore::FutureWarning:google.api_core",
  # Ignore warnings from Optuna 3.0 internal code
  # TODO(kmaehashi): Remove after the issue is fixed in Optuna.
  "ignore:(.+?) has been deprecated in v3.0.0:FutureWarning:optuna",
  # Ignore warnings from SQLAlchemy on which Optuna depends
  'ignore:Deprecated API features detected! These feature\(s\) are not compatible with SQLAlchemy 2\.0\.:DeprecationWarning:optuna',
  'ignore:(.+?)SQLAlchemy 2\.0(.+?):DeprecationWarning',
  # setuptools 65+
  # TODO(kmaehashi): Remove distutils from cupy_builder to remove this
  "ignore:Absolute path '(.+?)' is being replaced with a relative path '(.+?)' for outputs:DeprecationWarning:distutils",
  # Older SciPy versions + NumPy 2.5+ do not avoid this warning.
  "ignore:Setting the shape on a NumPy:DeprecationWarning:scipy",
]

[tool.coverage.run]
plugins = "Cython.Coverage"
include = ["cupy/*", "cupyx/*", "examples/*"]

[tool.coverage.report]
ecxlude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 79
extend-exclude = [
  "docs/source",
  "third_party",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I002", "FA", "PYI", "PLC01"]
extend-ignore = [
  "UP031", # printf-string-formatting
  "UP032", # f-string
]

[tool.ruff.lint.per-file-ignores]
"cupyx/scipy/special/_gammainc.py" = [
  "E501", # line-too-long (table of constants)
]
"tests/typing_tests/cupy_tests/creation_tests/test_basic.pyi" = [
  "E501", # line-too-long (long comments)
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
