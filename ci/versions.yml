cuda:
  build:
    version: "13.4.1"
  prev_build:
    version: "12.9.2"
python:
  # Python versions the wheel matrix is built across. ci.yml reads this
  # list and passes it to build-wheel.yml as the `python-versions` input.
  supported:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.14t"
    - "3.15"
    - "3.15t"
  # Single Python version used by the `/test doc-only` lane and by RTD's
  # docs.yml wheel install step. `version` is also the wheel/artifact label
  # (cupy-cuda13x-py<version>-...), so it must be a plain X.Y version.
  doc:
    version: "3.12"
    # setup-python spec for the docs.yml runner. It must select the same X.Y
    # as `version` (the wheel has to install into it) and a patch whose ssl
    # module blocks the compromised eMudhra/emSign CAs. Keep the floor in
    # sync with .github/actions/update-pip/action.yml.
    setup_spec: "~3.12.16"
