name: Harden pip
description: >-
  Bootstrap pip 26.2.2 from a hash-pinned URL, before any other use of pip,
  then upgrade to the latest release with that trusted pip.
  Older pip releases always trust their vendored certifi bundle, which still
  includes the compromised eMudhra/emSign intermediate CAs, so they are
  vulnerable to MITM attacks against PyPI. Upgrading pip with such a pip does
  not help (it downloads the new pip over the same connection), hence the
  direct URL with a SHA-256 fragment.
  See https://discuss.python.org/t/109576

inputs:
  python:
    description: Python executable whose pip is upgraded.
    required: false
    default: python

runs:
  using: composite
  steps:
    # The pin may be removed once every Python used by CI ships pip>=26.2.2
    # or its ssl module blocks the eMudhra CAs (see .pfnci/schema.yaml).
    - name: Install pip 26.2.2 (hash-pinned), then upgrade
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        "${PYTHON}" -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        "${PYTHON}" -m pip install --disable-pip-version-check --upgrade pip
        "${PYTHON}" -m pip --version
