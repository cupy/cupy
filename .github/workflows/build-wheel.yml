name: Build CuPy wheel

on:
  workflow_call:
    inputs:
      host-platform:
        description: "linux-64, linux-aarch64, or win-64"
        required: true
        type: string
      cuda-version:
        description: "Full CTK version to download from redist (e.g. 12.9.2)"
        required: true
        type: string
      ref:
        description: "Git ref to check out for the workflow-scoped files under .github/ + ci/ (e.g. refs/pull/N/merge, or a merge_commit_sha). The cupy source itself is unpacked from the sdist artifact -- NOT from this ref."
        required: true
        type: string
      artifact-suffix:
        description: "Suffix keying the wheel artifact name (pr<N>-<head sha> for /test builds, the push SHA post-merge); what the test stage looks up. The sdist artifact (cupy-sdist-<suffix>) MUST already exist under the same suffix."
        required: true
        type: string

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

permissions:
  contents: read  # This is required for actions/checkout

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
    name: py${{ matrix.python-version }}
    runs-on: ${{ (inputs.host-platform == 'linux-64'      && 'ubuntu-22.04')     ||
                 (inputs.host-platform == 'linux-aarch64' && 'ubuntu-22.04-arm') ||
                 (inputs.host-platform == 'win-64'        && 'windows-2022') }}
    steps:
      - name: Verify LongPathsEnabled on Windows
        if: ${{ inputs.host-platform == 'win-64' }}
        shell: pwsh -command ". '{0}'"
        run: |
          $val = (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled').LongPathsEnabled
          echo "LongPathsEnabled = $val"
          if ($val -ne 1) {
            echo "::error::LongPathsEnabled is not set to 1 (see cuda-python#1820)"
            exit 1
          }

      # Sparse checkout of the workflow-scoped tree only: .github/actions/*
      # (local action refs), ci/tools/*, ci/versions.yml, ci/ helper dirs.
      # The cupy source (cupy/, cupyx/, cupy_backends/, install/,
      # pyproject.toml, setup.py, MANIFEST.in, ...) comes from the sdist
      # artifact, unpacked over the workspace in the next step -- guaranteeing
      # that the wheel is built from the SAME bytes we'd publish to PyPI, so
      # a MANIFEST.in gap fails this CI job (not a downstream user).
      - name: Checkout workflow-scoped files
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            ci

      - name: Download sdist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: cupy-sdist-${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/sdist

      # The sdist unpacks into ./srcpkg/ (a subdirectory, NOT the workspace
      # root). This keeps the sparse checkout's .git/ + .github/ + ci/
      # separate from the sdist tree, so cupy_builder/_preflight.py sees a
      # normal sdist unpack (no .git under source_root -> third_party/
      # submodules not required). Everything the wheel build touches --
      # source, mini-CTK, preloads, generated metadata -- lives under
      # ./srcpkg/, so cibuildwheel's package-dir mount = /project inside
      # the container is self-contained.
      # --strip-components=1 drops the sdist's leading ``cupy-<version>/``.
      # --force-local stops Git Bash's tar on Windows from parsing the
      # runner-temp drive letter (``D:\a\_temp``) as an SSH ``host:path``.
      - name: Unpack sdist into ./srcpkg
        run: |
          mkdir -p srcpkg
          tar --force-local -xf "${RUNNER_TEMP}/sdist"/cupy-*.tar.gz -C srcpkg --strip-components=1
          ls -lah srcpkg/pyproject.toml srcpkg/setup.py srcpkg/MANIFEST.in srcpkg/cupy srcpkg/cupyx srcpkg/cupy_backends srcpkg/install 2>/dev/null

      # Temporarily disabled: mini-CTK moved out of the workspace so
      # cibuildwheel no longer copies ~1-2 GB into /project. Observing
      # whether cu13 / py3.14t still OOMs; re-enable if it does.
      # - name: Free disk space (Linux + free-threaded Python)
      #   if: ${{ inputs.host-platform == 'linux-64' && endsWith(matrix.python-version, 't') }}
      #   uses: ./.github/actions/free-disk-space

      # Pinned rather than `latest`: an sccache release can change its cache-key
      # format (v0.17.0-rapids.0 split CUDA caching into per-sub-tool
      # ptxas/cicc/cudafe++), which invalidates the warm GHA sccache cache and
      # forces a full recompile on every PR until the shared cache re-warms.
      # Bump SCCACHE_VERSION deliberately.
      - name: Install pinned rapidsai/sccache
        env:
          HOST_PLATFORM: ${{ inputs.host-platform }}
          SCCACHE_VERSION: v0.17.0-rapids.4
        run: |
          case "${HOST_PLATFORM}" in
            linux-*)  URL_TRIPLE="$(uname -m)-unknown-linux-musl"; SCCACHE_BIN="sccache" ;;
            win-*)    URL_TRIPLE="x86_64-pc-windows-msvc";         SCCACHE_BIN="sccache.exe" ;;
            *)        echo "Unsupported host-platform: ${HOST_PLATFORM}" >&2; exit 1 ;;
          esac
          mkdir -p sccache_bin
          curl -fsSL "https://github.com/rapidsai/sccache/releases/download/${SCCACHE_VERSION}/sccache-${URL_TRIPLE}.tar.gz" \
            | tar -C sccache_bin -xzf - --wildcards --strip-components=1 "*/${SCCACHE_BIN}"
          SCCACHE_BIN_DIR="$(pwd)/sccache_bin"
          SCCACHE_BIN_FULL="${SCCACHE_BIN_DIR}/${SCCACHE_BIN}"
          # On Windows, convert Git Bash's POSIX form to a native Windows path.
          if [[ "${HOST_PLATFORM}" == win-* ]]; then
            SCCACHE_BIN_DIR="$(cygpath -w "${SCCACHE_BIN_DIR}")"
            SCCACHE_BIN_FULL="$(cygpath -w "${SCCACHE_BIN_FULL}")"
          fi
          echo "${SCCACHE_BIN_DIR}" >> "$GITHUB_PATH"
          echo "SCCACHE_PATH=${SCCACHE_BIN_FULL}" >> "$GITHUB_ENV"

      # xref: https://github.com/orgs/community/discussions/42856#discussioncomment-7678867
      - name: Adding addtional GHA cache-related env vars
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env['ACTIONS_RUNTIME_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Set up Python
        id: setup-python1
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          # WAR: setup-python is not relocatable, and cibuildwheel hard-wires to 3.12...
          # see https://github.com/actions/setup-python/issues/871
          python-version: "3.12"

      - name: Set up MSVC
        if: ${{ startsWith(inputs.host-platform, 'win') }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1

      - name: Set up yq
        # GitHub made an unprofessional decision to not provide it in their Windows VMs,
        # see https://github.com/actions/runner-images/issues/7443.
        if: ${{ startsWith(inputs.host-platform, 'win') }}
        env:
          YQ_VERSION: v4.52.5
          YQ_SHA256: 47594981f3848a4b4447494adeca9555f908f7cf0a89c4da3fd0243a4631da1c
          YQ_DIR: yq
        shell: pwsh -command ". '{0}'"
        run: |
          $yqUrl = "https://github.com/mikefarah/yq/releases/download/${env:YQ_VERSION}/yq_windows_amd64.exe"
          mkdir -Force -ErrorAction SilentlyContinue "${env:YQ_DIR}" | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "${env:YQ_DIR}/yq.exe" -Uri "$yqUrl"
          $hash = (Get-FileHash -Algorithm SHA256 "${env:YQ_DIR}/yq.exe").Hash.ToLower()
          if ($hash -ne $env:YQ_SHA256) {
            Write-Error "SHA256 mismatch for yq: expected $env:YQ_SHA256, got $hash"
            exit 1
          }
          ls -l $env:YQ_DIR
          echo "$((Get-Location).Path)\\$env:YQ_DIR" >> $env:GITHUB_PATH
          $env:Path += ";$((Get-Location).Path)\\$env:YQ_DIR"
          yq --version

      - name: Set environment variables
        env:
          CUDA_VER: ${{ inputs.cuda-version }}
          HOST_PLATFORM: ${{ inputs.host-platform }}
          PY_VER: ${{ matrix.python-version }}
          SHA: ${{ github.sha }}
        run: ./ci/tools/env-vars build

      - name: Dump environment
        run: env

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          pip install tomli_w pyyaml twine

      # Install under RUNNER_TEMP so cibuildwheel doesn't copy the mini-CTK
      # (~1-2 GB) into /project on Linux; the container reaches it through the
      # /host mount instead (see CUDA_PATH in CIBW_ENVIRONMENT_LINUX). Windows
      # runs natively so it doesn't gain the /project savings; using the same
      # path keeps this step readable.
      - name: Set up mini CTK
        uses: ./.github/actions/fetch_ctk
        continue-on-error: false
        with:
          host-platform: ${{ inputs.host-platform }}
          cuda-version: ${{ inputs.cuda-version }}
          cuda-components: "cuda_nvcc,cuda_cudart,cuda_crt,cuda_cuxxfilt,libnvvm,cuda_nvrtc,cuda_nvtx,cuda_profiler_api,cuda_cccl,libnvjitlink,libcublas,libcufft,libcurand,libcusparse,libcusolver"
          cuda-path: ${{ runner.temp }}/cuda_toolkit

      - name: Install cuTENSOR preload
        env:
          INSTALL_LIB_ARCH: ${{ (inputs.host-platform == 'linux-aarch64' && 'aarch64') || 'x86_64' }}
        run: |
          python srcpkg/cupyx/tools/install_library.py \
            --library cutensor --cuda ${{ env.BUILD_CUDA_MAJOR }}.x \
            --arch "${INSTALL_LIB_ARCH}" --prefix ./srcpkg/preloads --action install

      - name: Install NCCL preload (Linux only)
        if: ${{ startsWith(inputs.host-platform, 'linux-') }}
        env:
          INSTALL_LIB_ARCH: ${{ (inputs.host-platform == 'linux-aarch64' && 'aarch64') || 'x86_64' }}
        run: |
          python srcpkg/cupyx/tools/install_library.py \
            --library nccl --cuda ${{ env.BUILD_CUDA_MAJOR }}.x \
            --arch "${INSTALL_LIB_ARCH}" --prefix ./srcpkg/preloads --action install

      # --source-root ./srcpkg points prepare_wheel_build.py at the
      # unpacked sdist tree so it rewrites srcpkg/pyproject.toml (not
      # the sparse checkout at workspace root). --root-prefix
      # /project/srcpkg re-anchors the emitted CUPY_INCLUDE_PATH /
      # CUPY_LIBRARY_PATH / CUPY_INSTALL_LONG_DESCRIPTION /
      # CUPY_INSTALL_WHEEL_METADATA to the in-container location:
      # cibuildwheel copies the ENTIRE workspace to /project, then
      # invokes `python -m build /project/srcpkg`, so srcpkg is at
      # /project/srcpkg inside the container. Windows builds run
      # natively (no container) so the host paths are used verbatim --
      # hence the linux-only flag.
      - name: Prepare wheel build
        run: |
          python ci/tools/prepare_wheel_build.py \
            --cuda-major ${{ env.BUILD_CUDA_MAJOR }} \
            --host-platform ${{ inputs.host-platform }} \
            --source-root ./srcpkg \
            --preload-dir ./srcpkg/preloads \
            ${{ startsWith(inputs.host-platform, 'linux-') && '--root-prefix /project/srcpkg' || '' }} >> "$GITHUB_ENV"

      - name: Build cupy-cuda${{ env.BUILD_CUDA_MAJOR }}x wheel
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084  # v3.4.1
        with:
          package-dir: ./srcpkg
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ env.CIBW_BUILD }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: >
            CUPY_INSTALL_NO_RPATH
            CUPY_INSTALL_LONG_DESCRIPTION
            CUPY_INSTALL_WHEEL_METADATA
            CUPY_INCLUDE_PATH
            CUPY_LIBRARY_PATH
            CUPY_PACKAGE_NAME
            CUPY_NUM_BUILD_JOBS
          # NOTE: cibuildwheel resolves CIBW_ENVIRONMENT_<PLATFORM> *in place
          # of* CIBW_ENVIRONMENT (last-match-wins, no merging -- see
          # OptionsReader.get() in cibuildwheel/options.py). A generic
          # CIBW_ENVIRONMENT block would be silently ignored on platforms that
          # define a platform block, so keep shared variables duplicated in
          # BOTH platform blocks below.
          CIBW_ENVIRONMENT_LINUX: >
            CUDA_PATH=/host/${{ env.CUDA_PATH }}
            LIBRARY_PATH=/host/${{ env.CUDA_PATH }}/lib64/stubs
            CC="/host/${{ env.SCCACHE_PATH }} cc"
            CXX="/host/${{ env.SCCACHE_PATH }} c++"
            NVCC="/host/${{ env.SCCACHE_PATH }} /host/${{ env.CUDA_PATH }}/bin/nvcc"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR=/host/${{ env.SCCACHE_DIR }}
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          # Windows builds run natively (no container), so the ACTIONS_*
          # values would flow in from the job environment -- but set them
          # explicitly anyway so both platform blocks are self-contained.
          CIBW_ENVIRONMENT_WINDOWS: >
            CUDA_PATH="$(cygpath -w ${{ env.CUDA_PATH }})"
            NVCC="sccache nvcc"
            SCCACHE_GHA_ENABLED=true
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
            ACTIONS_RUNTIME_URL=${{ env.ACTIONS_RUNTIME_URL }}
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_CACHE_URL=${{ env.ACTIONS_CACHE_URL }}
            ACTIONS_CACHE_SERVICE_V2=${{ env.ACTIONS_CACHE_SERVICE_V2 }}
            SCCACHE_DIR='${{ env.SCCACHE_DIR }}'
            SCCACHE_CACHE_SIZE=${{ env.SCCACHE_CACHE_SIZE }}
          CIBW_BEFORE_TEST_LINUX: >
            "/host/${{ env.SCCACHE_PATH }}" --show-adv-stats &&
            "/host/${{ env.SCCACHE_PATH }}" --show-stats --stats-format=json > /host/${{ github.workspace }}/sccache_cupy.json
          CIBW_BEFORE_TEST_WINDOWS: >
            "${{ env.SCCACHE_PATH }}" --show-adv-stats &&
            "${{ env.SCCACHE_PATH }}" --show-stats --stats-format=json > "${{ github.workspace }}\\sccache_cupy.json"
          CIBW_TEST_COMMAND: >
            echo "ok!"
          # Exercises the [ctk] extra as a self-contained pypi install:
          # pip install {wheel}[ctk] pulls the cuda-toolkit metapackage
          # (nvidia-cudart-cu12, nvidia-cublas-cu12, ...); cuda-pathfinder
          # locates them under site-packages/nvidia/*/lib at import time.
          # Guards regressions in the [ctk] extra contents and cuda-pathfinder
          # resolution. Distinct from the retired cuda-build lane's "system
          # libcublas via apt after removing /usr/local/cuda" invariant.
          CIBW_TEST_EXTRAS_LINUX: ctk
          CIBW_TEST_COMMAND_LINUX: >
            python {package}/tests/import_tests/test_import.py
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir}
            --exclude 'libcuda.so*'
            --exclude 'libcudart.so*'
            --exclude 'libcublas.so*'
            --exclude 'libcublasLt.so*'
            --exclude 'libcufft.so*'
            --exclude 'libcurand.so*'
            --exclude 'libcusparse.so*'
            --exclude 'libcusolver.so*'
            --exclude 'libnvrtc.so*'
            --exclude 'libnvrtc-builtins.so*'
            --exclude 'libnvJitLink.so*'
            --exclude 'libcutensor.so*'
            --exclude 'libcutensorMg.so*'
            --exclude 'libnccl.so*'
            {wheel}
          CIBW_BEFORE_BUILD_WINDOWS: pip install delvewheel
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair -w {dest_dir} {wheel}
            --exclude "nvcuda.dll;cudart64_*.dll;cublas64_*.dll;cublasLt64_*.dll;cufft64_*.dll;curand64_*.dll;cusparse64_*.dll;cusolver64_*.dll;nvrtc64_*.dll;nvrtc-builtins64_*.dll;nvJitLink_*.dll;cutensor.dll;cutensorMg.dll"
          CIBW_BUILD_VERBOSITY: 1

      - name: Report sccache stats (cupy-cuda${{ env.BUILD_CUDA_MAJOR }}x)
        uses: ./.github/actions/sccache-summary
        with:
          json-file: sccache_cupy.json
          label: "cupy-cuda${{ env.BUILD_CUDA_MAJOR }}x"
          build-step: "Build cupy-cuda${{ env.BUILD_CUDA_MAJOR }}x wheel"

      - name: List the wheelhouse contents
        run: |
          if [[ "${{ inputs.host-platform }}" == win* ]]; then
            export CHOWN=chown
          else
            export CHOWN="sudo chown"
          fi
          $CHOWN -R $(whoami) wheelhouse
          ls -lahR wheelhouse

      - name: Check wheel
        run: |
          twine check --strict wheelhouse/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cupy-cuda${{ env.BUILD_CUDA_MAJOR }}x-py${{ matrix.python-version }}-${{ inputs.host-platform }}-${{ inputs.artifact-suffix }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          # Keep "re-run all jobs" viable: v4+ artifacts are immutable, so a
          # second attempt's upload would otherwise collide and fail.
          overwrite: true
