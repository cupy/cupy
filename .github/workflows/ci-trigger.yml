name: "CI Trigger"

# Turns /test comments into ci:triggered label events -- which start the
# build workflow (ci.yml) -- and keeps the label honest when the PR changes.
# The full three-workflow flow is described in ci.yml's header comment.
#
# Every issue comment on the repository creates a (job-gated) run here; that
# matches the old flexci.yml, which also triggered on issue_comment.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, reopened]

# Least privilege: read-only by default; the two jobs below elevate
# explicitly (test-request reads the PR; hygiene writes the label).
permissions:
  contents: read

jobs:
  # Leg 1 of the /test flow: validate the request, record it for flexci.yml,
  # and bounce the ci:triggered label so the build leg fires.
  test-request:
    name: Record /test request + trigger build
    if: github.repository_owner == 'cupy' && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN only reads the PR (guard step); the label bounce uses a
    # separate GitHub App token, so no issues:write is needed here. No checkout,
    # so no contents access either.
    permissions:
      pull-requests: read
    # CI_TRIGGER_APP_ID / CI_TRIGGER_APP_PRIVATE_KEY are scoped to this
    # deployment environment (branch policy: main only -- which is the ref
    # issue_comment runs execute on). Each /test records a deployment here.
    environment: ci-trigger
    concurrency:
      group: ci-trigger-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
      skip_mode: ${{ steps.guard.outputs.skip_mode }}
      pr_number: ${{ steps.guard.outputs.pr_number }}
      head_sha: ${{ steps.guard.outputs.head_sha }}
      base_ref: ${{ steps.guard.outputs.base_ref }}
    steps:
      - name: Validate the /test request
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ok=false
          skip_mode=false
          pr_number=""
          head_sha=""
          base_ref=""
          if ! jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "Not a PR comment; skipping"
          elif ! jq -r '.comment.body' "$GITHUB_EVENT_PATH" | grep -qE '^/test[[:space:]]+[^[:space:]]'; then
            echo "Comment does not start with '/test <target>'; skipping"
          else
            # A /test skip | force-skip needs no wheel build -- the dispatcher
            # just posts "skipped" (force-skip: override) statuses. Flag it so
            # the build leg is short-circuited (see the dispatch-skip job); a
            # real /test <target> falls through to the label bounce and builds.
            # Read the FIRST /test line only, matching what the dispatcher acts
            # on (flexci_dispatcher.extract_requested_tags returns the first
            # match): otherwise a comment like "/test cuda120" then "/test skip"
            # would bypass the build while the dispatcher forwards cuda120 with
            # no wheel. A first line that is not exactly skip/force-skip leaves
            # skip_mode false -> build-then-skip, the safe fallback.
            first_test="$(jq -r '.comment.body' "$GITHUB_EVENT_PATH" \
                | grep -m1 -E '^/test[[:space:]]+[^[:space:]]' || true)"
            if [[ "${first_test}" =~ ^/test[[:space:]]+(skip|force-skip)[[:space:]]*$ ]]; then
              skip_mode=true
            fi
            assoc="$(jq -r '.comment.author_association' "$GITHUB_EVENT_PATH")"
            if [[ "$assoc" != "OWNER" && "$assoc" != "MEMBER" ]]; then
              echo "::warning::Comment author_association=$assoc is not OWNER/MEMBER; skipping"
            else
              pr_json="$(gh api "$(jq -r '.issue.pull_request.url' "$GITHUB_EVENT_PATH")")"
              if [[ "$(jq -r '.state' <<< "$pr_json")" != "open" ]]; then
                echo "PR is not open; skipping"
              else
                pr_number="$(jq -r '.number' <<< "$pr_json")"
                head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
                base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
                ok=true
              fi
            fi
          fi
          {
            echo "ok=${ok}"
            echo "skip_mode=${skip_mode}"
            echo "pr_number=${pr_number}"
            echo "head_sha=${head_sha}"
            echo "base_ref=${base_ref}"
          } >> "$GITHUB_OUTPUT"

      # Recorded for BOTH paths: the build path (flexci.yml dispatches it
      # post-build) and skip. Skip uploads too so its request overwrites a
      # prior /test <target>'s (same dispatch-request-<pr>-<sha> name,
      # overwrite: true) -- then if that target's build already finished,
      # flexci.yml picks this skip request as newest and skips instead of
      # dispatching the stale target.
      - name: Save the dispatch request payload
        if: steps.guard.outputs.ok == 'true'
        env:
          BASE_REF: ${{ steps.guard.outputs.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/request"
          cp "${GITHUB_EVENT_PATH}" "${RUNNER_TEMP}/request/event.json"
          echo "${GITHUB_EVENT_NAME}" > "${RUNNER_TEMP}/request/event_name"
          echo "${BASE_REF}" > "${RUNNER_TEMP}/request/base_ref"

      - name: Upload request artifact
        if: steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dispatch-request-${{ steps.guard.outputs.pr_number }}-${{ steps.guard.outputs.head_sha }}
          path: ${{ runner.temp }}/request/
          if-no-files-found: error
          overwrite: true

      # Labels added with the workflow's own GITHUB_TOKEN do not trigger
      # workflow runs (GitHub's recursion prevention), so the bounce uses a
      # short-lived token minted from a code-less GitHub App (webhook
      # disabled, Pull requests: write -- needed to add/remove the ci:triggered
      # label on a PR; Issues:write alone does not cover PR labels -- installed
      # on this repository alone).
      # Requires repository configuration: variable CI_TRIGGER_APP_ID and
      # secret CI_TRIGGER_APP_PRIVATE_KEY.
      - name: Mint CI-trigger App token
        id: app-token
        if: steps.guard.outputs.ok == 'true' && steps.guard.outputs.skip_mode != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.CI_TRIGGER_APP_ID }}
          private-key: ${{ secrets.CI_TRIGGER_APP_PRIVATE_KEY }}

      - name: Bounce the ci:triggered label
        if: steps.guard.outputs.ok == 'true' && steps.guard.outputs.skip_mode != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.guard.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Remove the label so that re-adding fires a fresh `labeled` event
          # even when it is still there from an earlier /test (adding an
          # already-present label fires no event). Delete-by-name: HTTP 404
          # just means it was not there; any other failure must abort the
          # job rather than report success without triggering a build.
          if ! out="$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/ci:triggered" 2>&1)"; then
            if ! grep -q "HTTP 404" <<< "${out}"; then
              echo "${out}" >&2
              exit 1
            fi
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=ci:triggered" >/dev/null

  # Leg 1b of the /test flow: a /test skip | force-skip needs no wheel, so
  # short-circuit the build -- run the dispatcher HERE to post the "skipped"
  # (or force-skip override) statuses, and deliberately do NOT bounce
  # ci:triggered, so ci.yml never builds. This restores the old FlexCI, where
  # skip was instant. A real /test <target> instead bounces the label above
  # and its wheel is built then dispatched post-build in flexci.yml.
  dispatch-skip:
    name: Post skipped statuses (no build)
    needs: test-request
    if: |
      github.repository_owner == 'cupy' &&
      needs.test-request.outputs.ok == 'true' &&
      needs.test-request.outputs.skip_mode == 'true'
    runs-on: ubuntu-latest
    # Join ci.yml's build concurrency group: a /test skip issued while an
    # earlier /test <target> is still building cancels that in-flight build,
    # and a cancelled build has conclusion != success, so flexci.yml never
    # dispatches the superseded target. (The label-bounce path gets this for
    # free -- its rebuild enters the same group; the skip path must opt in.)
    concurrency:
      group: ci-build-${{ github.event.issue.number }}
      cancel-in-progress: true
    # A separate job (not a step in test-request) so it gets its own
    # statuses/PR-write token without the app-scoped ci-trigger environment.
    permissions:
      contents: read        # checkout the dispatcher + config.tags.json
      statuses: write       # flexci_dispatcher.py writes commit statuses
      pull-requests: write  # dispatcher reads PR head + posts force-skip note
    steps:
      - name: Pin to the vouched head and base
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.test-request.outputs.pr_number }}
          VOUCHED_HEAD: ${{ needs.test-request.outputs.head_sha }}
          VOUCHED_BASE: ${{ needs.test-request.outputs.base_ref }}
        run: |
          set -euo pipefail
          # Head+base pin, mirroring flexci.yml's dispatch job: post skipped
          # statuses only if the PR still points at the head AND base the /test
          # comment vouched. The dispatcher writes statuses to the PR's *current*
          # head, so a push (new head) or a retarget (new base) landing between
          # the comment and this job would otherwise stamp skipped (green)
          # statuses onto an unvouched commit or under the wrong base.
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head="$(jq -r '.head.sha' <<< "${pr_json}")"
          current_base="$(jq -r '.base.ref' <<< "${pr_json}")"
          if [[ "${current_head}" != "${VOUCHED_HEAD}" ]]; then
            echo "::warning::PR #${PR_NUMBER} moved (${VOUCHED_HEAD} -> ${current_head}) since /test skip; re-issue the command."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          elif [[ "${current_base}" != "${VOUCHED_BASE}" ]]; then
            echo "::warning::PR #${PR_NUMBER} was retargeted (${VOUCHED_BASE} -> ${current_base}) since /test skip; re-issue the command."
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (dispatcher + project map, trusted default branch)
        if: steps.pin.outputs.moved != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        if: steps.pin.outputs.moved != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup Environment
        if: steps.pin.outputs.moved != 'true'
        run: pip install pygithub

      - name: Post skipped statuses (no dispatch, no build)
        if: steps.pin.outputs.moved != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Unused on the skip path (nothing is forwarded to FlexCI), but the
          # dispatcher reads it at startup, so pass it to match the flexci.yml
          # invocation. Repo-level secret (flexci.yml consumes it with no
          # environment), so this environment-less job can read it too.
          FLEXCI_WEBHOOK_SECRET: ${{ secrets.FLEXCI_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Same issue_comment payload the guard vetted; for skip/force-skip
          # the dispatcher posts statuses and forwards nothing. config.tags.json
          # is the trusted default-branch copy -- a PR must not get to redefine
          # which contexts are marked skipped.
          ./.github/workflows/scripts/flexci_dispatcher.py \
              --event issue_comment \
              --webhook "${GITHUB_EVENT_PATH}" \
              --projects .pfnci/config.tags.json \
              --external-tag jenkins \
              --external-tag rocm

  # Hygiene: a push to the PR (synchronize) or a reopen clears a stale
  # ci:triggered label, so its presence keeps meaning "the current head was
  # vouched". On synchronize, merely ENTERING the shared ci-build-<PR>
  # concurrency group (also used by ci.yml's labeled build runs; concurrency
  # groups are repo-scoped strings shared across workflows) cancels any
  # in-flight build for the superseded head. This runs the default branch's
  # workflow copy with a writable token and checks out no PR code.
  #
  # This deliberately does NOT fire on close/merge: a merged PR's ci:triggered
  # is stripped in backport.yml (before the backport bot copies the source
  # labels), not here -- doing it here would race the backport workflow, which
  # runs on the same pull_request_target: closed event.
  # TODO(leofang): when backporting is retired and backport.yml is removed,
  # nothing races this hygiene job on close anymore -- at that point move the
  # ci:triggered cleanup here: add `closed` to the pull_request_target trigger
  # above and clear the label on merge in this job.
  hygiene:
    name: Clear stale label
    if: github.repository_owner == 'cupy' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # Deletes the stale ci:triggered label via GITHUB_TOKEN; no checkout.
    # Labels on a PR require pull-requests:write (issues:write only covers
    # labels on issues), else DELETE .../issues/<pr>/labels/... returns 403.
    permissions:
      pull-requests: write
    concurrency:
      group: ci-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Clear ci:triggered if present
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Delete-by-name: HTTP 404 just means there was no stale label;
          # anything else is a real error. Removal with GITHUB_TOKEN fires
          # no workflow, so there is no recursion.
          if out="$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/ci:triggered" 2>&1)"; then
            echo "Cleared stale ci:triggered label"
          elif grep -q "HTTP 404" <<< "${out}"; then
            echo "No ci:triggered label to clear"
          else
            echo "${out}" >&2
            exit 1
          fi
