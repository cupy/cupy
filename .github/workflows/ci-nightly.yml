name: "Nightly CI"

# Run the "non-mini" pipelines every night.

on:
  schedule:
    # 02:00 UTC = 21:00 EST / 22:00 EDT
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch nightly FlexCI matrix
    if: github.repository_owner == 'cupy'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup Environment
        run: pip install pygithub

      # Newest main SHA whose wheels are already built (avoids racing an
      # in-flight ci.yml push run whose artifacts aren't up yet).
      - name: Resolve most recent main SHA with successful ci.yml wheels
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          if [[ -z "${HEAD_SHA}" ]]; then
            echo "::error::No successful ci.yml push run found on main; refusing to dispatch." >&2
            exit 1
          fi
          echo "Resolved SHA: ${HEAD_SHA}"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build synthetic push payload
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > payload.json <<EOF
          {
            "ref": "refs/heads/main",
            "after": "${HEAD_SHA}",
            "head_commit": {
              "id": "${HEAD_SHA}",
              "message": "Nightly CI: fire @nightly matrix against main HEAD",
              "url": "${RUN_URL}",
              "timestamp": "${TIMESTAMP}"
            },
            "repository": {
              "full_name": "${GITHUB_REPOSITORY}"
            },
            "sender": {
              "login": "github-actions[bot]"
            }
          }
          EOF
          cat payload.json

      - name: Dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEXCI_WEBHOOK_SECRET: ${{ secrets.FLEXCI_WEBHOOK_SECRET }}
        run: |
          ./.github/workflows/scripts/flexci_dispatcher.py \
              --event push \
              --webhook payload.json \
              --projects ".pfnci/config.tags.json" \
              --external-tag jenkins \
              --external-tag rocm \
              --override-tags @nightly
