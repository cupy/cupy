# Build Ascend (CANN) wheels on GitHub Actions.
#
# NOTE: This workflow ONLY builds wheels - no NPU is attached to GitHub
# runners, so no numeric tests are run and the import smoke check is
# DISABLED (importing the built wheel requires NPU runtime libs/devices).
# Real device tests must run on a self-hosted 910B/Atlas runner
# (see self-hosted-ci.yml).
#
# Wheels are auto-named by setup.py per CANN release train, e.g.
#   numpy_ascend-14.0.0a1+cann90-cp311-cp311-manylinux_2_34_x86_64.whl
# (the CANN train is a PEP 440 local version segment; the platform tag is a
# standard manylinux_* tag derived by auditwheel from the wheel's real glibc
# symbol baseline - manylinux_2_34 for the Ubuntu 22.04-based CANN images;
# PyPI rejects bare `linux_*` tags). The sdist is CANN-agnostic (bare
# `numpy_ascend-*.tar.gz`) and builds once.
#
# NOTE: keep ONE tag per CANN train in the default matrix. Different SoC tags
# of the same CANN version (e.g. -910b- vs -a3-) yield identically-named
# wheels that would collide when merged into dist/ at publish time.
#
# Trigger timing:
#   - workflow_dispatch: manual; target=build-only only uploads artifacts,
#     testpypi only builds (smoke-test the artifacts yourself), pypi publishes
#   - push tag v*: build + publish to PyPI + create/update Release with wheels
#   - release published: build + publish to PyPI + attach wheels to the Release
#   - regular push/PR: not triggered (no NPU; wheels are built on demand only)
#
# CANN base images come from quay.io/ascend/cann. Tag patterns look like
# `<cann>-<soc>-<os>-py<ver>[-devel]` (e.g. 9.0.1-a3-linux-py3.11).
# Verify available tags at https://quay.io/repository/ascend/cann before
# dispatching - the tag also fixes the default container Python (uv installs
# the requested CPython anyway) and the image architecture must match the
# runner (x86_64 tags on ubuntu-latest; aarch64 tags on ubuntu-24.04-arm,
# which is free for public repos). NOTE: the same cann_tag is pulled on both
# arch jobs; `docker pull` selects the native-arch manifest, so the tag must
# be multi-arch (or an aarch64 manifest must exist) or the arm job fails -
# in that case pass an aarch64-capable tag via the cann_tags input.

name: build-cann-wheels

on:
  workflow_dispatch:
    inputs:
      cann_tags:
        description: "Comma-separated quay.io/ascend/cann tags (ONE tag per CANN train)"
        # 8.5.1 -> cann85 wheel train, 9.0.1 -> cann90; distinct wheel names,
        # no collision. Verify the exact soc/os/py suffix on quay first.
        default: "8.5.1-910b-ubuntu22.04-py3.11,9.0.1-a3-ubuntu22.04-py3.11"
      pythons:
        description: "Comma-separated CPython versions"
        default: "3.10,3.11,3.12,3.13"
      archs:
        description: "Comma-separated archs (x86_64, aarch64)"
        default: "x86_64,aarch64"
      target:
        description: "Publish target"
        default: "build-only"
        type: choice
        options: [build-only, testpypi, pypi]
      socs:
        description: "Optional CUPY_ASCEND_KERNEL_SOCS for AOT AscendC kernels (e.g. Ascend910B4); empty = skip"
        default: ""
  release:
    types: [published]
  push:
    # Pushing a vX.Y.Z tag builds and publishes to PyPI automatically.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # GitHub Actions expressions have no split()/replace(), so expand the CSV
  # inputs to JSON arrays here (the fromJson(format(replace(...))) trick in
  # docs/ascend/GithubPackagingAndPypi.md does not work).
  gen-matrix:
    runs-on: ubuntu-latest
    outputs:
      cann_tags: ${{ steps.m.outputs.cann_tags }}
      pythons: ${{ steps.m.outputs.pythons }}
      archs: ${{ steps.m.outputs.archs }}
    steps:
      - id: m
        env:
          CANN_TAGS: ${{ inputs.cann_tags || '8.5.1-910b-ubuntu22.04-py3.11,9.0.1-a3-ubuntu22.04-py3.11' }}
          PYTHONS: ${{ inputs.pythons || '3.11,3.12' }}
          ARCHS: ${{ inputs.archs || 'x86_64,aarch64' }}
        run: |
          j() { printf '%s' "$1" | jq -Rsc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))'; }
          echo "cann_tags=$(j "$CANN_TAGS")" >> "$GITHUB_OUTPUT"
          echo "pythons=$(j "$PYTHONS")"     >> "$GITHUB_OUTPUT"
          echo "archs=$(j "$ARCHS")"         >> "$GITHUB_OUTPUT"

  wheel:
    needs: gen-matrix
    strategy:
      fail-fast: false
      matrix:
        cann_tag: ${{ fromJson(needs.gen-matrix.outputs.cann_tags) }}
        python: ${{ fromJson(needs.gen-matrix.outputs.pythons) }}
        arch: ${{ fromJson(needs.gen-matrix.outputs.archs) }}
    # aarch64 CANN images need an arm runner; do NOT build them under QEMU.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      IMAGE: quay.io/ascend/cann:${{ matrix.cann_tag }}
    steps:
      - uses: actions/checkout@v4
        # third_party submodules are not needed: the Ascend build disables
        # them (see setup.py / cupy_builder), so keep checkout fast.

      - name: Log in to Quay.io (optional, avoids anonymous-pull rate limits)
        env:
          QUAY_ROBOT_USER: ${{ secrets.QUAY_ROBOT_USER }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        # NOTE: the `secrets` context is not usable in step-level `if:`
        # expressions, so skip the login inside the shell instead.
        run: |
          if [ -n "$QUAY_ROBOT_USER" ] && [ -n "$QUAY_ROBOT_TOKEN" ]; then
            echo "$QUAY_ROBOT_TOKEN" | docker login quay.io -u "$QUAY_ROBOT_USER" --password-stdin
          else
            echo "QUAY_ROBOT_USER/QUAY_ROBOT_TOKEN not set; pulling anonymously"
          fi

      - name: Build wheel inside CANN container
        env:
          # Optional AOT kernel SoCs, only passed through when non-empty
          SOCS: ${{ inputs.socs }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

          SOC_ARGS=()
          if [ -n "$SOCS" ]; then
            SOC_ARGS=(-e "CUPY_ASCEND_KERNEL_SOCS=$SOCS")
          fi

          mkdir -p dist
          docker run --rm -i \
            -v "$PWD":/src -w /src \
            -e CUPY_INSTALL_USE_ASCEND=1 \
            -e CANN_PYTHON="${{ matrix.python }}" \
            -e TARGET_ARCH="${{ matrix.arch }}" \
            "${SOC_ARGS[@]}" \
            "$IMAGE" bash -s <<'BUILD_SCRIPT'
            set -euxo pipefail
            PYVER="$CANN_PYTHON"

            # CANN environment (set_env.sh exports ASCEND_HOME_PATH and
            # LD_LIBRARY_PATH for libascendcl etc.)
            if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then
              # shellcheck disable=SC1091
              . /usr/local/Ascend/ascend-toolkit/set_env.sh
            fi
            export ASCEND_HOME_PATH="${ASCEND_HOME_PATH:-/usr/local/Ascend/ascend-toolkit/latest}"

            # The image's bundled Python is fixed by its tag; install the
            # requested CPython with uv instead of fragile
            # update-alternatives juggling.
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv python install "$PYVER"
            uv venv /opt/venv --python "$PYVER"
            . /opt/venv/bin/activate

            # Build requirements must be pre-installed for --no-isolation
            # (keep in sync with pyproject.toml [build-system].requires:
            # setuptools>=77, wheel, Cython>=3.2,<3.3, numpy>=2.0).
            # NOTE: Cython is capped at <3.3 on purpose -- upstream CuPy main
            # (a3851f0f1) uses the same `Cython>=3.2,<3.3` ceiling, so 3.3 is
            # not yet validated; do not relax this without testing.
            uv pip install "pip>=24" "setuptools>=77" wheel \
              "Cython>=3.2,<3.3" fastrlock "numpy>=2.0,<2.7" build

            python -V
            python -m build --wheel --no-isolation -o /src/dist

            # Repair to a manylinux tag: PyPI rejects bare `linux_*` platform
            # tags. CANN runtime libs (libascendcl, libopapi, liboptiling, ...)
            # must come from the host CANN install, so they are excluded by
            # resolved path - auditwheel matches `--exclude` against both the
            # SONAME and the realpath (see
            # docs/ascend/GithubPackagingAndPypi.md section 7).
            # NOTE 1: `patchelf` is NOT a dependency of the auditwheel package
            # (it ships the patchelf binary); without it repair dies with
            # "Cannot find required utility 'patchelf' in PATH" - install both.
            # Fall back to apt if the PyPI wheel has no binary for this arch.
            # NOTE 2: no `--plat`: the CANN images are Ubuntu 22.04 (glibc
            # 2.35) and the built extensions reference libpthread.so.0 plus
            # GLIBC_2.32 symbols, which pins the real baseline at
            # manylinux_2_34 (measured 2026-10: auditwheel show -> "constrains
            # the platform tag to manylinux_2_34_x86_64"). Letting auditwheel
            # derive the tag from the symbols is both honest and self-adapting;
            # PyPI accepts arbitrary manylinux_<major>_<minor>_<arch>. A
            # manylinux_2_28 wheel would need a manylinux_2_28 build container
            # with CANN installed.
            uv pip install auditwheel patchelf || true
            if ! command -v patchelf >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq patchelf
            fi
            auditwheel show dist/*.whl || true
            if auditwheel repair \
                --exclude '/usr/local/Ascend/*' \
                --exclude '*/Ascend/*' \
                dist/*.whl -w /src/wheelhouse; then
              rm -f dist/*.whl
              mv /src/wheelhouse/*.whl dist/
            else
              echo "::warning::auditwheel repair failed; shipping unrepaired wheels (PyPI will reject linux_* platform tags)"
              rm -rf /src/wheelhouse
            fi

            # Smoke check DISABLED: there is no NPU on CI, and importing the
            # built wheel needs the Ascend runtime (libascendcl etc. plus a
            # visible device), which a bare container does not provide.
            # Re-enable on a self-hosted NPU runner:
            #   uv pip install /src/dist/*.whl
            #   cd /tmp && python -c "import cupy._core"
            ls -l /src/dist
          BUILD_SCRIPT

          # The container runs as root; fix ownership before uploading.
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Derive CANN train tag for artifact naming (9.0.1 -> cann90)
        id: train
        run: echo "train=cann$(printf '%s' '${{ matrix.cann_tag }}' | awk -F. '{print $1 $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: numpy-ascend-${{ steps.train.outputs.train }}-py${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # One CANN-agnostic tarball (numpy_ascend-<ver>.tar.gz); building an
      # sdist needs no CANN at all (sdist keeps Cython sources only).
      - run: python -m pip install -U build && python -m build --sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    # Trigger: release published, push tag v*, or manual dispatch with
    # target=pypi (dispatch testpypi/build-only only uploads artifacts).
    # NOTE: under tag push / release events `inputs.target` is null, so the
    # condition must check the event name explicitly (`inputs.target !=
    # 'build-only'` is always true on tag push).
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'pypi'
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi          # must match the GitHub Environment pending on PyPI; drop this line if unused
      url: https://pypi.org/project/numpy-ascend/
    permissions:
      id-token: write     # required for OIDC Trusted Publishing (publish job only)
      contents: write   # attach wheels to the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Artifacts are uploaded per matrix entry as wheel-<tag>-py<ver>-<arch>
          # plus sdist; merge them all into a single dist/ directory here.
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Select PyPI upload set (primary CANN train + sdist)
        # PyPI rejects local version identifiers, so only the primary train's
        # wheels (bare public version, filename without `+cannX.Y`) plus the
        # sdist are uploaded. Every other train's wheels stay on the GitHub
        # Release and are installed with
        #   pip install numpy-ascend==<ver>+cannX.Y \
        #     --find-links https://github.com/<owner>/<repo>/releases/expanded_assets/<tag>
        run: |
          mkdir -p pypi_dist
          cp dist/*.tar.gz pypi_dist/
          for f in dist/*.whl; do
            case "$f" in
              *+*) ;;                      # local-versioned train: Release only
              *) cp "$f" pypi_dist/ ;;     # primary train: PyPI
            esac
          done
          if ! ls pypi_dist/*.whl >/dev/null 2>&1; then
            echo "::error::no primary-train wheel in dist/ - the PyPI train build must have failed"
            exit 1
          fi
          ls -l pypi_dist
      - name: twine check
        run: python -m pip install twine && python -m twine check pypi_dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No username/password: v1.11+ generates PEP 740 attestations by default
        with:
          packages-dir: pypi_dist/
      - name: Attach artifacts to the GitHub Release
        # release event: attach to the published Release; push tag v*: the
        # action creates the Release from the tag and attaches the artifacts.
        # NOTE: `!cancelled()` (not the default success()) so the Release is
        # still created when the PyPI publish step fails (e.g. a trusted-
        # publisher name mismatch) — otherwise a failed upload silently
        # skips this step and no Release ever appears.
        if: ${{ !cancelled() && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*