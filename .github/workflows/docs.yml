name: "Docs: Build and publish"

# Fires after ci.yml finishes building wheels (same chain as flexci.yml).
# Downloads the py<doc> linux-64 cu13 wheel from the triggering CI run,
# builds the Sphinx HTML with RTD env vars mimicked, and -- in a separate
# job with no PR code checked out -- POSTs to RTD's build-trigger API.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: docs-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-22.04
    if: >-
      github.repository_owner == 'cupy' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      proceed: ${{ steps.compute.outputs.proceed }}
      rtd_slug: ${{ steps.compute.outputs.rtd_slug }}
    steps:
      # workflow_run.pull_requests[] is empty for fork PRs, so instead of
      # parsing the event payload we download the per-run sentinel artifact
      # ci.yml's build-sentinel uploaded (name is `push-event-<sha>` for
      # push, `build-<sha>` for PR). The sentinel carries docs-meta.json
      # with mode / pr_number / head_sha / merge_sha / artifact_suffix,
      # which is enough to drive the rest of this job. python_doc_ver is
      # read from ci/versions.yml after checkout below.
      - name: Determine sentinel artifact name
        id: sentinel
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${EVENT}" == "push" ]]; then
            NAME="push-event-${HEAD_SHA}"
          else
            NAME="build-${HEAD_SHA}"
          fi
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"

      - name: Download sentinel
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: ${{ steps.sentinel.outputs.name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./sentinel

      - name: Parse docs-meta + compute RTD slug
        id: compute
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          META=./sentinel/docs-meta.json
          test -f "${META}" || { echo "::error::docs-meta.json missing from sentinel"; exit 1; }
          MODE=$(jq -r .mode "${META}")
          PR_NUMBER=$(jq -r .pr_number "${META}")

          # Only `test` and `doc-only` produce the wheel docs.yml needs;
          # on skip / no-op we still emit every output (so the job-level
          # outputs block is well-defined) and let `proceed=false` gate
          # the rest of the job + the publish lane.
          if [[ "${MODE}" != "test" && "${MODE}" != "doc-only" ]]; then
            echo "::notice::mode=${MODE}; nothing to build"
            PROCEED=false
            RTD_SLUG=""
          else
            PROCEED=true
            if [[ -n "${PR_NUMBER}" ]]; then
              RTD_SLUG="${PR_NUMBER}"
            elif [[ "${BRANCH}" == "main" ]]; then
              RTD_SLUG="latest"
            else
              # v*/hotfix-* branches: compute slug anyway (so the HTML
              # artifact is still produced for debugging) but the publish
              # job's `if:` gates them out below.
              RTD_SLUG="${BRANCH}"
            fi
          fi

          {
            echo "proceed=${PROCEED}"
            echo "head_sha=$(jq -r .head_sha "${META}")"
            echo "merge_sha=$(jq -r .merge_sha "${META}")"
            echo "suffix=$(jq -r .artifact_suffix "${META}")"
            echo "rtd_slug=${RTD_SLUG}"
          } >> "${GITHUB_OUTPUT}"

      # Every step below is gated on proceed == 'true' so skip-mode runs
      # end here cleanly.
      - name: Checkout cupy at the tested revision (same ref ci.yml built)
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ steps.compute.outputs.merge_sha }}
          fetch-depth: 1

      - name: Read python.doc.version from ci/versions.yml
        if: steps.compute.outputs.proceed == 'true'
        id: pyver
        run: echo "value=$(yq '.python.doc.version' ci/versions.yml)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ steps.pyver.outputs.value }}

      - name: Download cupy wheel from triggering CI run
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: cupy-cuda13x-py${{ steps.pyver.outputs.value }}-linux-64-${{ steps.compute.outputs.suffix }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./wheel

      - name: Install docs requirements + cupy[ctk]
        if: steps.compute.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          WHEEL=$(ls wheel/cupy_cuda13x-*.whl)
          python -m pip install "${WHEEL}[ctk]"

      # Run sphinx from docs/ (not the repo root): CWD is on sys.path and
      # `./cupy/` would shadow the installed wheel, so autodoc would import
      # the uncompiled source tree and fail on the Cython extensions.
      - name: Build HTML docs
        if: steps.compute.outputs.proceed == 'true'
        working-directory: docs
        env:
          # Mimic the RTD build env so docs/source/conf.py's extlinks tag
          # resolution and cupy/cuda/__init__.py's RTD import guards behave
          # identically to a RTD-run build.
          READTHEDOCS: "True"
          READTHEDOCS_PROJECT: cupy
          READTHEDOCS_LANGUAGE: en
          READTHEDOCS_VERSION: ${{ steps.compute.outputs.rtd_slug }}
          READTHEDOCS_VERSION_TYPE: ${{ github.event.workflow_run.event == 'pull_request' && 'external' || 'branch' }}
          READTHEDOCS_GIT_COMMIT_HASH: ${{ steps.compute.outputs.head_sha }}
        run: |
          python -m sphinx -T -j auto -b html source build/html

      - name: Upload HTML artifact
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html-${{ steps.compute.outputs.suffix }}
          path: docs/build/html
          if-no-files-found: error
          retention-days: 90

  # Separate job so PR code never shares a runner with RTD_API_TOKEN:
  # `build` above checks out PR code and runs sphinx (no secrets);
  # `publish` runs on a fresh runner with no checkout, only the token.
  publish:
    name: Publish docs to RTD
    needs: build
    # Publish only on main pushes and PR previews. v*/hotfix-* branches
    # skip until RTD has those versions activated.
    if: >-
      needs.build.outputs.proceed == 'true' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      # Non-fatal: if RTD_API_TOKEN is unset or the version slug isn't
      # activated on RTD, log and continue.
      - name: Trigger RTD build
        env:
          RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          RTD_SLUG: ${{ needs.build.outputs.rtd_slug }}
        run: |
          if [[ -z "${RTD_API_TOKEN}" ]]; then
            echo "::warning::RTD_API_TOKEN not set; skipping trigger"
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/rtd_trigger.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Token ${RTD_API_TOKEN}" \
            "https://readthedocs.org/api/v3/projects/cupy/versions/${RTD_SLUG}/builds/")
          echo "RTD responded ${HTTP_CODE}"
          cat /tmp/rtd_trigger.json || true
          if [[ "${HTTP_CODE}" == "202" ]]; then
            echo "RTD build triggered for version '${RTD_SLUG}'"
          elif [[ "${HTTP_CODE}" == "404" ]]; then
            echo "::warning::RTD version '${RTD_SLUG}' is not activated; skipping"
          else
            echo "::error::RTD trigger failed (${HTTP_CODE})"
            exit 1
          fi
