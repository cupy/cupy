name: "Docs: Build and publish"

# Fires after ci.yml finishes building wheels (same chain as flexci.yml).
# Downloads the py<doc> linux-64 cu13 wheel from the triggering CI run,
# builds the Sphinx HTML with RTD env vars mimicked, and -- in a separate
# job with no PR code checked out -- uploads the HTML to RTD via the
# three-step /api/v3/upload/ REST flow (initiate -> presigned S3 POST ->
# complete). RTD serves what we uploaded; it does not run a build of its
# own after .readthedocs.yaml is removed in stage 2 (#10351).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Keyed on the triggering workflow_run id, not head_sha: distinct CI runs
# (same main-push + its tag-push, or a no-op label event + the real PR
# build at the same SHA) each get their own group and don't cancel each
# other.
concurrency:
  group: docs-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash --noprofile --norc -xeuo pipefail {0}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-22.04
    if: >-
      github.repository_owner == 'cupy' &&
      github.event.workflow_run.conclusion == 'success'
    outputs:
      proceed: ${{ steps.compute.outputs.proceed }}
      rtd_slug: ${{ steps.compute.outputs.rtd_slug }}
      rtd_version_name: ${{ steps.compute.outputs.rtd_version_name }}
      version_type: ${{ steps.compute.outputs.version_type }}
      suffix: ${{ steps.compute.outputs.suffix }}
      head_sha: ${{ steps.compute.outputs.head_sha }}
      promote_stable: ${{ steps.stable.outputs.promote_stable }}
    steps:
      # workflow_run.pull_requests[] is empty for fork PRs, so instead of
      # parsing the event payload we download the per-run sentinel artifact
      # ci.yml's build-sentinel uploaded (name is `push-event-<sha>` for
      # push, `build-<sha>` for PR). The sentinel carries docs-meta.json
      # with mode / pr_number / head_sha / merge_sha / artifact_suffix /
      # event / ref, which is enough to drive the rest of this job.
      #
      # mode=no-op runs (unrelated label events, branch deletes, skip-ci
      # pushes) upload NO sentinel but still succeed, so workflow_run
      # fires here. continue-on-error turns a missing artifact into a
      # non-fatal step; the compute step below reads steps.sentinel.outcome
      # and no-ops the whole workflow cleanly when the download failed.
      - name: Download sentinel
        id: sentinel
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: >-
            ${{ github.event.workflow_run.event == 'push'
                && format('push-event-{0}', github.event.workflow_run.head_sha)
                || format('build-{0}', github.event.workflow_run.head_sha) }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./sentinel

      - name: Parse docs-meta + compute RTD slug
        id: compute
        env:
          SENTINEL_OUTCOME: ${{ steps.sentinel.outcome }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          # Always emit every output so the job-level outputs block is
          # well-defined; downstream steps + the publish job gate on
          # `proceed`.
          PROCEED=false
          RTD_SLUG=""
          RTD_VERSION_NAME=""
          VERSION_TYPE=""
          HEAD_SHA=""
          MERGE_SHA=""
          SUFFIX=""

          if [[ "${SENTINEL_OUTCOME}" == "success" ]]; then
            META=./sentinel/docs-meta.json
            test -f "${META}" || { echo "::error::docs-meta.json missing from sentinel"; exit 1; }
            MODE=$(jq -r .mode "${META}")
            PR_NUMBER=$(jq -r .pr_number "${META}")
            REF=$(jq -r .ref "${META}")
            HEAD_SHA=$(jq -r .head_sha "${META}")
            MERGE_SHA=$(jq -r .merge_sha "${META}")
            SUFFIX=$(jq -r .artifact_suffix "${META}")

            # Defense-in-depth validation: SUFFIX / HEAD_SHA / MERGE_SHA
            # get interpolated into shell + API payloads downstream, so
            # reject anything with shell metacharacters even though the
            # trusted builder currently only produces hex SHAs / PR
            # numbers. Keeps the rules loose enough to tolerate future
            # format tweaks (dots, underscores) while blocking $, `, ;,
            # quotes, spaces, etc.
            for field_name in SUFFIX HEAD_SHA MERGE_SHA; do
              value="${!field_name}"
              if ! [[ "${value}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::docs-meta ${field_name} is malformed: ${value}"
                exit 1
              fi
            done

            if [[ "${MODE}" != "test" && "${MODE}" != "doc-only" ]]; then
              echo "::notice::mode=${MODE}; nothing to build"
            else
              # Route by EVENT first, not PR_NUMBER: ci-guard.sh sets
              # pr_number on main-push for the merged PR (needed for the
              # skip-ci check), and classifying every main-push as an
              # external preview would mean `latest` never updates.
              #
              # rtd_slug is what conf.py reads via READTHEDOCS_VERSION
              # (and what the sphinx extlinks tag resolves against).
              # rtd_version_name is what the RTD /api/v3/upload/
              # initiate payload uses: for main the upload must be
              # name=main / type=branch so RTD's
              # UploadInitiateView._get_or_create_version matches the
              # existing machine-managed `latest` alias on
              # `latest.identifier == name` -- uploading with
              # name=latest misses that check, falls through to the
              # verbose-name match, and rewrites the alias with
              # identifier=latest / machine=False (the alias stops
              # tracking main).
              if [[ "${EVENT}" == "pull_request" ]]; then
                PROCEED=true
                RTD_SLUG="${PR_NUMBER}"
                RTD_VERSION_NAME="${PR_NUMBER}"
                VERSION_TYPE="external"
              elif [[ "${REF}" == refs/tags/* ]]; then
                PROCEED=true
                RTD_SLUG="${REF#refs/tags/}"
                RTD_VERSION_NAME="${RTD_SLUG}"
                VERSION_TYPE="tag"
              elif [[ "${BRANCH}" == "main" ]]; then
                PROCEED=true
                RTD_SLUG="latest"
                RTD_VERSION_NAME="main"
                VERSION_TYPE="branch"
              else
                # v*/hotfix-* branches: emit outputs for the HTML artifact
                # (still produced for debugging) but the publish job's
                # `if:` gates them out.
                PROCEED=true
                RTD_SLUG="${BRANCH}"
                RTD_VERSION_NAME="${BRANCH}"
                VERSION_TYPE="branch"
              fi
            fi
          fi

          {
            echo "proceed=${PROCEED}"
            echo "head_sha=${HEAD_SHA}"
            echo "merge_sha=${MERGE_SHA}"
            echo "suffix=${SUFFIX}"
            echo "rtd_slug=${RTD_SLUG}"
            echo "rtd_version_name=${RTD_VERSION_NAME}"
            echo "version_type=${VERSION_TYPE}"
          } >> "${GITHUB_OUTPUT}"

      # Every step below is gated on proceed == 'true' so skip-mode runs
      # end here cleanly.
      - name: Checkout cupy at the tested revision (same ref ci.yml built)
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ steps.compute.outputs.merge_sha }}
          fetch-depth: 1
          # tag refs needed by the "Decide stable promotion" step below;
          # we only need the names, not the tag commits themselves.
          fetch-tags: true

      # Promote stable to this upload when the current tag is the highest
      # final `vX.Y.Z` in the repo. Backport-safe: sort -V picks v14.1.0
      # over v13.6.0 even if v13.6.0 is pushed later. Prereleases
      # (vX.Y.ZaN / bN / rcN / etc.) are filtered out.
      - name: Decide stable promotion
        id: stable
        if: >-
          steps.compute.outputs.proceed == 'true' &&
          steps.compute.outputs.version_type == 'tag'
        env:
          TAG_NAME: ${{ steps.compute.outputs.rtd_slug }}
        run: |
          highest=$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)
          if [[ "${TAG_NAME}" == "${highest}" ]]; then
            echo "::notice::${TAG_NAME} is the highest final tag; promoting stable"
            echo "promote_stable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${TAG_NAME} is not the highest final tag (highest=${highest:-none}); keeping stable as-is"
            echo "promote_stable=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Read python.doc.version from ci/versions.yml
        if: steps.compute.outputs.proceed == 'true'
        id: pyver
        run: echo "value=$(yq '.python.doc.version' ci/versions.yml)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ steps.pyver.outputs.value }}

      - name: Download cupy wheel from triggering CI run
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: cupy-cuda13x-py${{ steps.pyver.outputs.value }}-linux-64-${{ steps.compute.outputs.suffix }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./wheel

      # nvidia-nccl-cu13 isn't pulled in by cupy[ctk]; autodoc on
      # cupyx.distributed otherwise emits "libnccl.so.* not found"
      # warnings that bubble up as unresolved references in the HTML.
      - name: Install docs requirements + cupy[ctk] + nccl
        if: steps.compute.outputs.proceed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          WHEEL=$(ls wheel/cupy_cuda13x-*.whl)
          python -m pip install "${WHEEL}[ctk]" nvidia-nccl-cu13

      # Run sphinx from docs/ (not the repo root): CWD is on sys.path and
      # `./cupy/` would shadow the installed wheel, so autodoc would import
      # the uncompiled source tree and fail on the Cython extensions.
      - name: Build HTML docs
        if: steps.compute.outputs.proceed == 'true'
        working-directory: docs
        env:
          # Mimic the RTD build env so docs/source/conf.py's extlinks tag
          # resolution and cupy/cuda/__init__.py's RTD import guards behave
          # identically to a RTD-run build.
          READTHEDOCS: "True"
          READTHEDOCS_PROJECT: cupy
          READTHEDOCS_LANGUAGE: en
          READTHEDOCS_VERSION: ${{ steps.compute.outputs.rtd_slug }}
          READTHEDOCS_VERSION_TYPE: ${{ steps.compute.outputs.version_type }}
          READTHEDOCS_GIT_COMMIT_HASH: ${{ steps.compute.outputs.head_sha }}
        run: |
          # -W --keep-going turns Sphinx warnings into errors but walks
          # the full build before failing so one iteration surfaces the
          # whole backlog. Once #10361 removes pretest's `-W` build,
          # this is the only docs lint; the nccl install step above
          # already addresses one class of autodoc warning.
          python -m sphinx -T -j auto -W --keep-going -b html source build/html

      - name: Upload HTML artifact
        if: steps.compute.outputs.proceed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html-${{ steps.compute.outputs.suffix }}
          path: docs/build/html
          if-no-files-found: error
          retention-days: 90

  # Separate job so PR code never shares a runner with RTD_API_TOKEN:
  # `build` above checks out PR code and runs sphinx (no secrets);
  # `publish` runs on a fresh runner with no checkout, only the token.
  publish:
    name: Publish docs to RTD
    needs: build
    # Publish on PR previews (external), main push (latest), and
    # release-tag push (vX.Y.Z). v*/hotfix-* branch pushes still skip:
    # the branches tie back to pre-release work and RTD doesn't carry
    # per-branch versions for them.
    if: >-
      needs.build.outputs.proceed == 'true' &&
      (needs.build.outputs.version_type == 'external' ||
       needs.build.outputs.version_type == 'tag' ||
       (needs.build.outputs.version_type == 'branch' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download HTML artifact
        # Same-run default: the build job above uploaded this artifact
        # into the current docs.yml run, not into the triggering CI run.
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: docs-html-${{ needs.build.outputs.suffix }}
          path: ./html

      # Three-step RTD upload per readthedocs/readthedocs-cli's reference
      # flow:
      #   1. POST /api/v3/upload/initiate/ -- RTD creates a draft build,
      #      returns a presigned S3 URL + required form fields + the new
      #      build id + the resolved version slug.
      #   2. POST <presigned S3 URL> -- multipart with the fields from
      #      step 1 and the zip. RTD never sees the token here.
      #   3. POST /api/v3/upload/complete/ -- mark the build success or
      #      failed so RTD processes (or discards) it.
      # Archive layout is dictated by the API: html files under html/**
      # at the zip root. Non-fatal when the token is unset so stage 1
      # can land before the secret is wired. All PR-origin values
      # (SUFFIX, HEAD_SHA, RTD_VERSION_NAME, RTD_VERSION_TYPE) flow via
      # the env to avoid interpolating `${{ ... }}` into the script.
      - name: Upload HTML to RTD
        env:
          RTD_API_TOKEN: ${{ secrets.RTD_API_TOKEN }}
          RTD_VERSION_NAME: ${{ needs.build.outputs.rtd_version_name }}
          RTD_VERSION_TYPE: ${{ needs.build.outputs.version_type }}
          HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          SUFFIX: ${{ needs.build.outputs.suffix }}
          PROMOTE_STABLE: ${{ needs.build.outputs.promote_stable }}
        run: |
          if [[ -z "${RTD_API_TOKEN}" ]]; then
            echo "::warning::RTD_API_TOKEN not set; skipping upload"
            exit 0
          fi

          mkdir -p stage/html
          cp -a ./html/. stage/html/
          (cd stage && zip -qr "${RUNNER_TEMP}/build.zip" .)

          # Returns 0 on a successful round-trip (initiate 2xx + S3 2xx +
          # complete 2xx), non-zero otherwise with the error already
          # logged via ::error::. Safe to call multiple times with
          # different (name, type) to publish the same zip to the
          # primary slug and to the `stable` alias.
          upload_version() {
            local name="$1"
            local type="$2"
            local label="${type}/${name}"
            local initiate_file="${RUNNER_TEMP}/rtd_initiate_${type}_${name}.json"
            local s3_file="${RUNNER_TEMP}/rtd_s3_${type}_${name}.txt"
            local complete_file="${RUNNER_TEMP}/rtd_complete_${type}_${name}.json"

            local payload
            payload=$(jq -nc \
              --arg name "${name}" \
              --arg type "${type}" \
              --arg commit "${HEAD_SHA}" \
              '{project: "cupy", version: {name: $name, type: $type, commit: $commit}}')

            local initiate_code
            initiate_code=$(curl -sS -o "${initiate_file}" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Token ${RTD_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${payload}" \
              "https://app.readthedocs.org/api/v3/upload/initiate/")
            if [[ "${initiate_code}" != 2* ]]; then
              echo "::error::RTD initiate (${label}) failed (${initiate_code})"
              cat "${initiate_file}" || true
              return 1
            fi

            local build_id upload_url resolved_slug
            build_id=$(jq -r '.build.id' "${initiate_file}")
            upload_url=$(jq -r '.upload_url.url' "${initiate_file}")
            resolved_slug=$(jq -r '.version.slug // ""' "${initiate_file}")
            if [[ "${build_id}" == "null" || -z "${build_id}" ]]; then
              echo "::error::RTD initiate (${label}) response missing build.id"
              cat "${initiate_file}"
              return 1
            fi

            # Safety net suggested in review: if an upload of
            # (main, branch) does NOT resolve to the `latest` alias,
            # RTD's machine-managed state has drifted (someone edited
            # it by hand); fail loudly rather than publish a new
            # /en/main/ public version. Same guard for the stable
            # alias upload.
            case "${label}" in
              branch/main)
                if [[ "${resolved_slug}" != "latest" ]]; then
                  echo "::error::upload of main resolved to '${resolved_slug}', expected 'latest' (RTD alias drifted?)"
                  _rtd_complete "${build_id}" failed "${complete_file}" || true
                  return 1
                fi
                ;;
              tag/stable)
                if [[ "${resolved_slug}" != "stable" ]]; then
                  echo "::error::upload of stable resolved to '${resolved_slug}', expected 'stable' (RTD alias drifted?)"
                  _rtd_complete "${build_id}" failed "${complete_file}" || true
                  return 1
                fi
                ;;
            esac

            # Build the field arg list from the presigned URL's fields.
            # --form-string (vs -F) keeps values literal: `-F` would
            # reinterpret an `@` or `<` as a file reference and `;` as
            # a type modifier. AWS field values don't carry those
            # today, but --form-string is free and future-proof.
            local -a field_args=()
            local key value
            while IFS= read -r key; do
              value=$(jq -r --arg k "${key}" '.upload_url.fields[$k]' "${initiate_file}")
              field_args+=("--form-string" "${key}=${value}")
            done < <(jq -r '.upload_url.fields | keys[]' "${initiate_file}")

            # Retry on transport failures (curl error -> code 000) and
            # 5xx server errors; stop on 2xx (done) or 4xx (client-side,
            # won't improve). Matches readthedocs-cli's upload_artifacts
            # loop (UPLOAD_ATTEMPTS=3, exponential backoff). The
            # `|| echo 000` fallback keeps a connection reset during
            # the ~100 MB POST from aborting the function (set -e)
            # before _rtd_complete ... failed can run; otherwise the
            # pending build sits against RTD's upload cap.
            local attempt s3_code=000 delay
            for attempt in 1 2 3; do
              s3_code=$(curl -sS -o "${s3_file}" -w '%{http_code}' \
                -X POST \
                "${field_args[@]}" \
                -F "file=@${RUNNER_TEMP}/build.zip;type=application/zip" \
                "${upload_url}" || echo 000)
              if [[ "${s3_code}" == 2* ]] || [[ "${s3_code}" == 4* ]]; then
                break
              fi
              if [[ ${attempt} -lt 3 ]]; then
                delay=$((attempt * 2))
                echo "::notice::S3 upload (${label}) returned ${s3_code}; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done
            if [[ "${s3_code}" != 2* ]]; then
              echo "::error::S3 upload (${label}) failed after ${attempt} attempt(s) (${s3_code})"
              cat "${s3_file}" || true
              _rtd_complete "${build_id}" failed "${complete_file}" || true
              return 1
            fi

            if ! _rtd_complete "${build_id}" success "${complete_file}"; then
              return 1
            fi

            echo "::notice::Uploaded docs-html-${SUFFIX} to RTD build #${build_id} (${label}, slug=${resolved_slug})"
          }

          # Separate out the complete step so it can both signal the
          # happy path AND be reused by error-path cleanup. Returns 0
          # on 2xx, non-zero on anything else -- but a failure here on
          # the error path is already logged, so the caller discards
          # with `|| true`.
          _rtd_complete() {
            local build_id="$1"
            local status="$2"
            local out="$3"
            local code
            code=$(curl -sS -o "${out}" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Token ${RTD_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"build\": ${build_id}, \"status\": \"${status}\"}" \
              "https://app.readthedocs.org/api/v3/upload/complete/" || echo 000)
            if [[ "${code}" != 2* ]]; then
              echo "::error::RTD complete (build #${build_id}, status=${status}) failed (${code})"
              cat "${out}" || true
              return 1
            fi
          }

          upload_version "${RTD_VERSION_NAME}" "${RTD_VERSION_TYPE}"

          if [[ "${PROMOTE_STABLE}" == "true" ]]; then
            upload_version stable tag
          fi
