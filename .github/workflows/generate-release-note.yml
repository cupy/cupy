name: "Generate Release Note"

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Milestone to generate release notes for"
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: python -m pip install "PyGithub==2.9.1"
    - name: Generate release note
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MILESTONE: ${{ inputs.milestone }}
      run: |
        python docs/generate_release_note.py \
          --milestone "${MILESTONE}" \
          --out "${GITHUB_STEP_SUMMARY}"
