name: "FlexCI"

# The sole dispatcher call site (see ci.yml's header for the three-workflow
# flow). Fires on workflow_run for any successful ci.yml completion and
# invokes flexci_dispatcher.py with either the vouched issue_comment
# payload (PR /test path -- forward or skip per the comment body) or the
# recorded push payload (post-merge dispatch). Runs the default-branch
# copy of this file from a trusted context with secrets available.
#
# This workflow also reaps no-op label runs (#10230): after dispatch has
# finished with the triggering run, reap-noop-run deletes it if the guard
# declined it, removing its skipped check runs from the PR's checks display.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Least privilege: read-only by default; the job below elevates explicitly.
permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch FlexCI
    if: |
      github.repository_owner == 'cupy' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    permissions:
      actions: read         # read triggering-run + request artifacts
      contents: read        # checkout (dispatcher + PR config data)
      pull-requests: write  # read open PRs by head + post force-skip comments
      statuses: write       # flexci_dispatcher.py commit statuses

    steps:
    - name: Find the request(s) for this run
      id: request
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        HEAD_REPO_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        REPO_ID: ${{ github.event.repository.id }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail

        # Liveness: fetch the triggering run's artifacts once and require
        # the appropriate sentinel to be present. This is the per-run
        # dispatch gate -- absent it, every no-op ci.yml completion on the
        # same head (unrelated-label runs) would re-invoke the dispatcher.
        # Fetch first so an API failure fails the job (visible,
        # re-runnable) instead of reading as "sentinel absent".
        trigger_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}/artifacts" \
            --jq '[.artifacts[].name]')"

        mkdir -p "${RUNNER_TEMP}/requests"
        dispatch_list=()

        case "${WORKFLOW_EVENT}" in
        pull_request)
          if ! jq -e --arg n "build-${HEAD_SHA}" 'index($n) != null' <<< "${trigger_artifacts}" >/dev/null; then
            echo "Triggering run has no PR dispatch sentinel (no-op run); nothing to dispatch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Identity, from trusted API metadata only (never from artifacts,
          # which PR-controlled runs can name freely): the open PR(s) whose
          # head is the branch this run built.
          candidates="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${HEAD_REPO_OWNER}:${HEAD_BRANCH}&state=open" \
              --jq '.[].number')"
          if [[ -z "${candidates}" ]]; then
            echo "No open PR for ${HEAD_REPO_OWNER}:${HEAD_BRANCH}; nothing to dispatch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Per candidate PR: a trusted /test request must exist for
          # exactly this (PR, head), and the PR must still point where the
          # vouch pointed (head-pin) with the same base (base-ref pin).
          for pr in ${candidates}; do
            name="dispatch-request-${pr}-${HEAD_SHA}"
            # Newest artifact with this name produced by a run of this
            # repository's own default branch: only trusted issue_comment
            # runs qualify (fork runs carry the fork's head_repository_id).
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
                --jq "[.artifacts[] | select(.expired == false
                       and .workflow_run.head_repository_id == ${REPO_ID}
                       and .workflow_run.head_branch == \"${DEFAULT_BRANCH}\")]
                      | sort_by(.created_at) | last | .id // empty")"
            if [[ -z "${artifact_id}" ]]; then
              echo "PR #${pr}: no vouched request for ${HEAD_SHA}; skipping"
              continue
            fi
            # Download by immutable artifact id (unambiguous across re-runs).
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                > "${RUNNER_TEMP}/requests/${pr}.zip"
            mkdir -p "${RUNNER_TEMP}/requests/${pr}"
            unzip -q -o "${RUNNER_TEMP}/requests/${pr}.zip" -d "${RUNNER_TEMP}/requests/${pr}"
            if [[ "$(cat "${RUNNER_TEMP}/requests/${pr}/event_name")" != "issue_comment" ]]; then
              echo "::warning::PR #${pr}: request is not an issue_comment recording; skipping"
              continue
            fi
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            current_head="$(jq -r '.head.sha' <<< "${pr_json}")"
            current_base="$(jq -r '.base.ref' <<< "${pr_json}")"
            recorded_base="$(cat "${RUNNER_TEMP}/requests/${pr}/base_ref")"
            if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
              echo "::warning::PR #${pr} moved (${HEAD_SHA} -> ${current_head}) since /test; re-issue."
              continue
            fi
            if [[ "${current_base}" != "${recorded_base}" ]]; then
              echo "::warning::PR #${pr} was retargeted (${recorded_base} -> ${current_base}) since /test; re-issue."
              continue
            fi
            dispatch_list+=("${pr}")
          done
          echo "event=issue_comment" >> "$GITHUB_OUTPUT"
          ;;
        push)
          # For push, ci.yml uploads a push-event-<sha> artifact carrying
          # the pushed event payload. Its presence in this triggering run
          # is the push-leg liveness gate.
          name="push-event-${HEAD_SHA}"
          if ! jq -e --arg n "${name}" 'index($n) != null' <<< "${trigger_artifacts}" >/dev/null; then
            echo "Triggering push run has no push-event payload; nothing to dispatch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
              --jq "[.artifacts[] | select(.expired == false
                     and .workflow_run.id == ${TRIGGER_RUN_ID})]
                    | sort_by(.created_at) | last | .id // empty")"
          if [[ -z "${artifact_id}" ]]; then
            echo "Push payload artifact not found; nothing to dispatch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "${RUNNER_TEMP}/requests/push.zip"
          mkdir -p "${RUNNER_TEMP}/requests/push"
          unzip -q -o "${RUNNER_TEMP}/requests/push.zip" -d "${RUNNER_TEMP}/requests/push"
          dispatch_list+=("push")
          echo "event=push" >> "$GITHUB_OUTPUT"
          ;;
        esac

        if [[ ${#dispatch_list[@]} -eq 0 ]]; then
          echo "No dispatchable request; nothing to do."
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "prs=${dispatch_list[*]}" >> "$GITHUB_OUTPUT"

    - name: Checkout (dispatcher, trusted)
      if: steps.request.outputs.found == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Checkout (Untrusted Pull-Request Code, data only)
      if: steps.request.outputs.found == 'true' && steps.request.outputs.event == 'issue_comment'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Pinned to the tested revision, so the config.tags.json consumed
        # below matches the code that was built and vouched.
        ref: ${{ github.event.workflow_run.head_sha }}
        path: _pr_untrusted
        # Deliberate security decision (checkout v7, and the 2026-07-20
        # backports to older lines, refuses fork-PR code under workflow_run
        # by default): this tree is data only -- the dispatcher executes
        # from the trusted checkout above and merely json-loads
        # config.tags.json from here.
        allow-unsafe-pr-checkout: true

    - name: Checkout (pushed commit config, trusted)
      if: steps.request.outputs.found == 'true' && steps.request.outputs.event == 'push'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Pushed commits reach main/v*/hotfix-* only through review, so
        # config.tags.json at the pushed SHA is trusted.
        ref: ${{ github.event.workflow_run.head_sha }}
        path: _push_config

    - name: Setup Python
      if: steps.request.outputs.found == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.13'

    - name: Setup Environment
      if: steps.request.outputs.found == 'true'
      run: pip install pygithub

    - name: Dispatch
      if: steps.request.outputs.found == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        FLEXCI_WEBHOOK_SECRET: ${{ secrets.FLEXCI_WEBHOOK_SECRET }}
        EVENT: ${{ steps.request.outputs.event }}
        PRS: ${{ steps.request.outputs.prs }}
      run: |
        set -euo pipefail
        if [[ "${EVENT}" == "issue_comment" ]]; then
          projects="_pr_untrusted/.pfnci/config.tags.json"
        else
          projects="_push_config/.pfnci/config.tags.json"
        fi
        for pr in ${PRS}; do
          ./.github/workflows/scripts/flexci_dispatcher.py \
              --event "${EVENT}" \
              --webhook "${RUNNER_TEMP}/requests/${pr}/event.json" \
              --projects "${projects}" \
              --external-tag jenkins \
              --external-tag rocm
        done

  reap-noop-run:
    name: Reap no-op run
    # Unrelated-label events (triage, mergify, ...) still fire ci.yml (GitHub
    # can't filter `labeled` by name at the trigger level); the guard no-ops
    # them, but the skipped jobs land as check runs on the PR head -- with
    # unexpanded `matrix.*` template names -- burying the real signal
    # (#10230). Actions-owned check runs can't be edited or removed from
    # outside Actions, but deleting the completed no-op run removes its whole
    # check suite from the PR. Ordered after dispatch (needs:) so the
    # sentinel probe above never races the deletion, and gated on dispatch
    # succeeding -- the cleanup depends on the dispatch leg, never the
    # reverse. This job's own runs are associated with the default branch
    # head (like every workflow_run consumer), so it adds nothing to the PR.
    # The reaped run's identity and the guard's log are copied into this
    # job's (trusted, persistent) log before deletion, so reaping never
    # destroys the only record of what an untrusted PR ran.
    needs: dispatch
    # The event == 'pull_request' condition is load-bearing: it keeps the
    # delete away from push runs -- ci-nightly.yml ships the newest
    # successful ci.yml push run, so deleting one would silently move what
    # nightly ships.
    # The dispatch-succeeded gate is a fail-safe, not ordering (needs: plus
    # always() already sequence this job): a failed dispatch is re-runnable
    # by design, and deleting its triggering run would 404 every retry.
    # Once a retry succeeds, this job re-evaluates and reaps then. Deleting
    # is irreversible and cosmetic -- during an anomaly, do nothing.
    if: |
        always() &&
        github.repository_owner == 'cupy' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.dispatch.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      # actions: write is repo-wide (re-run/cancel/approve/delete caches).
      # Safe only because this job runs no checked-out or third-party code,
      # and untrusted values reach the shell via env only, never spliced
      # into the script by ${{ }}. Keep it that way.
      actions: write  # delete the no-op run
      checks: read    # read the run's check suite to prove it no-op'd

    steps:
    - name: Delete the triggering run iff it no-op'd
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
      run: |
        set -euo pipefail
        # A 404 means an earlier reap already got the run. Anything else
        # (rate limit, 5xx) fails visibly, matching the dispatch job's
        # stance on API errors.
        if ! run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            2>"${RUNNER_TEMP}/gh.err")"; then
          if grep -q 'HTTP 404' "${RUNNER_TEMP}/gh.err"; then
            echo "Run ${RUN_ID} already gone; nothing to reap."
            exit 0
          fi
          cat "${RUNNER_TEMP}/gh.err" >&2
          exit 1
        fi
        suite_id="$(jq -r '.check_suite_id' <<< "${run_json}")"

        # Only a completed first attempt is reaped. A rerun (run_attempt > 1)
        # or an attempt queued since the completion event means a human is
        # interacting with the run: keep it. (The check-runs listing below
        # shows only the latest attempt, while DELETE would remove every
        # attempt at once.)
        if [[ "$(jq -r '.status' <<< "${run_json}")" != "completed" ]] || \
           [[ "$(jq -r '.run_attempt' <<< "${run_json}")" != "1" ]]; then
          echo "Run ${RUN_ID} is not a completed first attempt; keeping."
          exit 0
        fi

        # No-op signature: exactly one successful check run (the guard) and
        # everything else skipped. Anything else -- a second success, a
        # failure, cancelled -- is a real build: keep it.
        page="$(gh api "repos/${GITHUB_REPOSITORY}/check-suites/${suite_id}/check-runs?per_page=100")"
        if [[ "$(jq -r '.total_count' <<< "${page}")" -gt 100 ]]; then
          # A no-op suite has ~9 entries; never classify a truncated page.
          echo "Suite has >100 check runs; real build, keeping."
          exit 0
        fi
        summary="$(jq -c '[.check_runs[].conclusion // "pending"]
                          | group_by(.) | map({(.[0]): length}) | add' <<< "${page}")"
        echo "Run ${RUN_ID} check-run conclusions: ${summary}"
        if [[ "$(jq -r '.success // 0' <<< "${summary}")" == "1" ]] && \
           [[ "$(jq -r 'keys - ["success", "skipped"] | length' <<< "${summary}")" == "0" ]]; then
          # Preserve what the run knew before deleting it: the deleted run
          # is the one record of untrusted code having executed (e.g. the
          # guard's ::warning:: when a non-writer hand-applies ci:triggered).
          echo "Reaping run ${RUN_ID}: ${HEAD_REPO}:${HEAD_BRANCH}@${HEAD_SHA} (triggered by ${ACTOR})"
          # The single successful job is the guard, per the signature above.
          # Its log must be secured before the run may be deleted: any
          # failure to fetch it keeps the run and fails visibly
          # (re-runnable), never erases the only record.
          guard_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
              --jq '[.jobs[] | select(.conclusion == "success")][0].id')"
          if [[ -z "${guard_job}" || "${guard_job}" == "null" ]]; then
            echo "::error::cannot identify the guard job of run ${RUN_ID}; keeping the run"
            exit 1
          fi
          # gh refuses escape sequences on non-TTY output (runners included):
          # allow them, strip on replay.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${guard_job}/logs" \
              --allow-escape-sequences > "${RUNNER_TEMP}/guard.log" \
              || [[ ! -s "${RUNNER_TEMP}/guard.log" ]]; then
            echo "::error::guard log of run ${RUN_ID} unavailable; keeping the run"
            exit 1
          fi
          echo "::group::Guard log (job ${guard_job})"
          # Suspend workflow-command parsing while replaying untrusted log
          # content: the legacy ##[cmd] parser matches anywhere in a line,
          # so the timestamp prefix alone is not a defense.
          stop_token="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${stop_token}"
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "${RUNNER_TEMP}/guard.log"
          echo "::${stop_token}::"
          echo "::endgroup::"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          echo "Deleted no-op run ${RUN_ID}; its check runs are gone from the PR."
        else
          echo "Real build; keeping."
        fi
