name: "Publish to PyPI"
run-name: "Publish to PyPI (${{ inputs.release }} - ${{ inputs.branch }})"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source Branch (e.g., v13)"
        default: "main"
      release:
        description: "Release to Publish (draft/tag, e.g., v14.0.0a1)"
        default: "v14.0.0rc9"

jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to read draft releases
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: cupy/cupy-release-tools
        ref: ${{ inputs.branch }}
    # path: _cupy keeps the release-tools root intact.
    - name: Checkout update-pip action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: _cupy
        sparse-checkout: .github/actions/update-pip
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '~3.11.18'
    - name: Update pip
      uses: ./_cupy/.github/actions/update-pip
    - name: Check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        STATUS=0
        pip install distlib
        ./check_release_assets.py --version "${{ inputs.release }}" --github > result.txt || STATUS=1
        cat result.txt

        echo '## Check Result' >> "${GITHUB_STEP_SUMMARY}"
        echo '```' >> "${GITHUB_STEP_SUMMARY}"
        cat result.txt >> "${GITHUB_STEP_SUMMARY}"
        echo '```' >> "${GITHUB_STEP_SUMMARY}"
        echo "::notice::Release: $(gh -R cupy/cupy release view '${{ inputs.release }}' --json 'url' --jq '.url')"

        exit ${STATUS}

  upload:
    needs: precheck
    environment:
      name: pypi-release
      url: https://pypi.org/org/cupy/
    permissions:
      contents: write  # to read draft releases
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Download (sdist)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh -R cupy/cupy release download "${{ inputs.release }}" --dir dist --pattern "cupy-*.tar.gz"
    - name: Download (wheels)
      if: ${{ inputs.branch != 'main' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh -R cupy/cupy release download "${{ inputs.release }}" --dir dist --pattern "cupy_*.whl"
    - name: Enumerate Files
      run: |
        cd dist
        ls -al $(find . -type f | sort) > ../files.txt
        cat ../files.txt

        echo '```' >> "${GITHUB_STEP_SUMMARY}"
        cat ../files.txt >> "${GITHUB_STEP_SUMMARY}"
        echo '```' >> "${GITHUB_STEP_SUMMARY}"
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        skip-existing: true
        print-hash: true

  postcheck:
    needs: upload
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: cupy/cupy-release-tools
        ref: ${{ inputs.branch }}
    # path: _cupy keeps the release-tools root intact.
    - name: Checkout update-pip action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: _cupy
        sparse-checkout: .github/actions/update-pip
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '~3.11.18'
    - name: Update pip
      uses: ./_cupy/.github/actions/update-pip
    - name: Check
      run: |
        pip install distlib
        CHECK_WHEEL="${{ inputs.branch != 'main' && '--pypi-wheel' || '' }}"

        for i in 1 2 3 4 5; do
          echo "Attempt ${i}: waiting for PyPI propagation..."
          sleep 120s
          if ./check_release_assets.py --version "${{ inputs.release }}" --pypi-sdist ${CHECK_WHEEL}; then
            echo "Check succeeded on attempt ${i}."
            exit 0
          fi
        done

        echo "All attempts failed; consider rerunning after few minutes."
        exit 1
