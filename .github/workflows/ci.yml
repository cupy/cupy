# Note: This name is referred to in the nightly workflow, so make sure any
# changes are sync'd up!
name: "CI"

# The build workflow. Its role in the three-workflow flow:
#
#   ci-trigger.yml : turns /test comments from an OWNER/MEMBER into a
#                    ci:triggered label event and records the comment
#                    payload as a vouched artifact for flexci.yml.
#   ci.yml (this)  : pull_request/labeled -- builds the vouched PR's pinned
#                    merge commit when the guard says mode=test; no-ops on
#                    mode=skip (still uploads a dispatch sentinel so
#                    flexci.yml fires) and on mode=no-op (unrelated label).
#                    push (main, v*, hotfix-*) -- builds the merged commit
#                    (mode=test) and uploads the push event for flexci.yml
#                    to consume.
#   flexci.yml     : the sole dispatcher call site. Fires on any successful
#                    ci.yml workflow_run and forwards to FlexCI or posts
#                    skip statuses per the recorded event payload.
#
# There is no automatic build on PR open/push: regular PR updates only run
# the lightweight pre-flight checks. A push to a PR cancels any in-flight
# labeled build (shared ci-build-<PR> concurrency group, entered by
# ci-trigger.yml's hygiene job) and clears the stale label.
on:
  pull_request:
    types: [labeled]
  push:
    branches:
      - main
      - "v*"
      - "hotfix-*"

concurrency:
  # Only the ci:triggered build shares ci-build-<PR> (with ci-trigger.yml's
  # hygiene runs): a second /test supersedes the first build, and a push to the
  # PR cancels it via hygiene. Every labeled event runs this workflow (GitHub
  # can't filter `labeled` by name), so any OTHER label must land in a unique,
  # throwaway group -- otherwise it would enter ci-build-<PR> and cancel the
  # in-flight vouched build before the guard no-ops it (concurrency is evaluated
  # at queue time, ahead of the guard job). Push runs share ci-push-<ref>: a
  # burst of merges lets the newest merge supersede any earlier in-flight run
  # on the same branch, so we don't burn build minutes on intermediate SHAs
  # whose wheels no one will consume. ci-nightly.yml already picks the newest
  # successful ci.yml push run, so cancelled intermediates are naturally
  # skipped there too.
  group: >-
    ${{ github.event_name == 'push' && format('ci-push-{0}', github.ref)
        || github.event.label.name == 'ci:triggered' && format('ci-build-{0}', github.event.pull_request.number)
        || format('ci-noop-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.label.name == 'ci:triggered' }}

# Least privilege: read-only by default; jobs that need more grant it
# per-job below. All dispatcher writes happen in flexci.yml -- ci.yml
# holds no `statuses: write` scope and no FLEXCI_WEBHOOK_SECRET reference.
permissions:
  contents: read

jobs:
  # flexci.yml's reap-noop-run identifies no-op label runs by looking for
  # a "CI no-op" check-run in the completed suite -- the dynamic name the
  # `checks` job below evaluates to when guard.outputs.mode == 'no-op'.
  # Renaming that check-run (or removing the checks job) silently
  # disables reaping (fails safe -- runs are kept -- but the PR checks
  # tab / ruleset UI displacement of #10230 returns).
  guard:
    name: Guard (build decision)
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cupy'
    permissions:
      actions: read        # ci-guard.sh reads the vouched artifact
      contents: read       # actions/checkout (sparse ci/)
      pull-requests: read  # ci-guard.sh reads commits/<sha>/pulls (push leg)
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      ref: ${{ steps.check.outputs.ref }}
      artifact_suffix: ${{ steps.check.outputs.artifact_suffix }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      CUDA_BUILD_VER: ${{ steps.vars.outputs.cuda_build_ver }}
      CUDA_PREV_BUILD_VER: ${{ steps.vars.outputs.cuda_prev_build_ver }}
    steps:
      # Which copy of ci-guard.sh runs follows GitHub's rules for the
      # workflow file itself: the pushed branch's copy for push events, the
      # PR's own copy for pull_request events -- where the run holds no
      # secrets and only PR-scoped cache access, so nothing
      # security-critical rides on it. In particular, the guard's `mode`
      # output is a routing hint only: the actual dispatcher call in
      # flexci.yml runs from a trusted checkout and re-reads the vouched
      # artifact independently.
      #
      # Sparse-checkout is `ci` (not `ci/tools`) so the same working tree
      # also exposes ci/versions.yml for the CUDA-version read below; on
      # pull_request events GITHUB_SHA is the merge commit and on push it
      # is the pushed SHA, both of which match needs.guard.outputs.ref
      # that downstream jobs pin to.
      - name: Checkout (ci/)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1
          sparse-checkout: ci
      - name: Evaluate trigger
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/tools/ci-guard.sh
      - name: Read CUDA build versions
        id: vars
        run: |
          cuda_build_ver=$(yq '.cuda.build.version' ci/versions.yml)
          echo "cuda_build_ver=$cuda_build_ver" >> $GITHUB_OUTPUT
          cuda_prev_build_ver=$(yq '.cuda.prev_build.version' ci/versions.yml)
          echo "cuda_prev_build_ver=$cuda_prev_build_ver" >> $GITHUB_OUTPUT

  # Producer of cupy-<version>.tar.gz for every wheel job below. Building
  # wheels from the sdist (instead of a fresh checkout) makes the sdist the
  # single source of truth for what ships to PyPI -- any MANIFEST.in gap
  # fails this CI job, not a downstream user. Also eliminates the Windows
  # vendored-submodule symlink handling (the sdist has real files).
  build-sdist:
    needs:
      - guard
    if: needs.guard.outputs.mode == 'test'
    permissions:
      contents: read
    name: Build sdist
    uses: ./.github/workflows/build-sdist.yml
    with:
      ref: ${{ needs.guard.outputs.ref }}
      artifact-suffix: ${{ needs.guard.outputs.artifact_suffix }}

  # NOTE: Build jobs are intentionally split by platform rather than using a
  # single matrix. This allows each test job to depend only on its
  # corresponding build, so faster platforms can proceed through build & test
  # without waiting for slower ones. Keep these job definitions textually
  # identical except for:
  #   - host-platform value
  # The reusable build workflow deliberately receives NO secrets: it needs
  # none (sccache uses the runner's ambient cache token), and labeled runs
  # of same-repo PRs would otherwise expose repository secrets to PR code.
  build-linux-64:
    needs:
      - guard
      - build-sdist
    if: needs.guard.outputs.mode == 'test'
    # Bounds the reusable build to a checkout-only token (no secrets, no writes).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - linux-64
        cuda-version:
          - ${{ needs.guard.outputs.CUDA_BUILD_VER }}
          - ${{ needs.guard.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ needs.guard.outputs.ref }}
      artifact-suffix: ${{ needs.guard.outputs.artifact_suffix }}

  # See build-linux-64 for why build jobs are split by platform.
  build-linux-aarch64:
    needs:
      - guard
      - build-sdist
    if: needs.guard.outputs.mode == 'test'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - linux-aarch64
        cuda-version:
          - ${{ needs.guard.outputs.CUDA_BUILD_VER }}
          - ${{ needs.guard.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ needs.guard.outputs.ref }}
      artifact-suffix: ${{ needs.guard.outputs.artifact_suffix }}

  # See build-linux-64 for why build jobs are split by platform.
  build-windows:
    needs:
      - guard
      - build-sdist
    if: needs.guard.outputs.mode == 'test'
    # Bounds the reusable build to a checkout-only token (no secrets, no writes).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - win-64
        cuda-version:
          - ${{ needs.guard.outputs.CUDA_BUILD_VER }}
          - ${{ needs.guard.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ needs.guard.outputs.ref }}
      artifact-suffix: ${{ needs.guard.outputs.artifact_suffix }}

  # Dispatch marker + payload for flexci.yml. Uploaded whenever this ci.yml
  # run should end in a flexci.yml dispatch call: mode=skip on PR (post
  # Skipped statuses via the dispatcher), or mode=test with all builds
  # succeeded (forward the wheels or the pushed event). The artifact's
  # presence in the triggering-run's own artifacts is the per-run dispatch
  # gate flexci.yml checks. For push runs its content is the pushed event
  # payload, which flexci.yml re-feeds to `flexci_dispatcher.py --event
  # push`; for PR runs a minimal marker file (event.json comes from the
  # vouched dispatch-request artifact ci-trigger.yml uploaded).
  # Deliberately carries NO identity beyond the head SHA (a PR-forgeable
  # artifact would reopen same-head cross-wiring); flexci.yml derives the
  # PR identity from trusted API metadata instead. Overwrite keeps "re-run
  # all jobs" viable (v4+ artifacts are otherwise immutable across
  # attempts).
  build-sentinel:
    name: Upload build sentinel
    needs:
      - guard
      - build-linux-64
      - build-linux-aarch64
      - build-windows
    if: |
      always() && (
        (github.event_name == 'pull_request' && needs.guard.outputs.mode == 'skip') ||
        (needs.guard.outputs.mode == 'test' &&
         needs.build-linux-64.result == 'success' &&
         needs.build-linux-aarch64.result == 'success' &&
         needs.build-windows.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Assemble artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/artifact"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            cp "${GITHUB_EVENT_PATH}" "${RUNNER_TEMP}/artifact/event.json"
          else
            echo "dispatch" > "${RUNNER_TEMP}/artifact/marker"
          fi
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: >-
            ${{ github.event_name == 'push'
                && format('push-event-{0}', needs.guard.outputs.head_sha)
                || format('build-{0}', needs.guard.outputs.head_sha) }}
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          overwrite: true

  # Merge-gating check. The job's NAME is dynamic on mode -- for mode=no-op
  # it becomes "CI no-op" so it does NOT satisfy the required "Check job
  # status" context. GitHub treats conditionally skipped required checks as
  # passing, so keeping the name static would let an unrelated label event
  # temporarily green a previously-failed head via a skipped check-run.
  # Only mode=test / mode=skip runs report as "Check job status".
  checks:
    name: >-
      ${{ needs.guard.outputs.mode == 'no-op'
          && 'CI no-op'
          || 'Check job status' }}
    if: always()
    runs-on: ubuntu-latest
    needs:
      - guard
      - build-linux-64
      - build-linux-aarch64
      - build-windows
      - build-sentinel
    steps:
      - name: Exit
        run: |
          status="success"
          check_result() {
            name=$1; expected=$2; result=$3
            echo "Checking $name: result='$result' (expected '$expected')"
            if [[ "$result" != "$expected" ]]; then
              echo "::error::$name did not match expected result"
              status="failed"
            fi
          }

          check_result "guard" "success" "${{ needs.guard.result }}"
          case "${{ needs.guard.outputs.mode }}" in
          test)
            check_result "build-linux-64"      "success" "${{ needs.build-linux-64.result }}"
            check_result "build-linux-aarch64" "success" "${{ needs.build-linux-aarch64.result }}"
            check_result "build-windows"       "success" "${{ needs.build-windows.result }}"
            check_result "build-sentinel"      "success" "${{ needs.build-sentinel.result }}"
            ;;
          skip)
            check_result "build-linux-64"      "skipped" "${{ needs.build-linux-64.result }}"
            check_result "build-linux-aarch64" "skipped" "${{ needs.build-linux-aarch64.result }}"
            check_result "build-windows"       "skipped" "${{ needs.build-windows.result }}"
            check_result "build-sentinel"      "success" "${{ needs.build-sentinel.result }}"
            ;;
          no-op)
            # Reported under a different check-run name ("CI no-op") so
            # this run does NOT satisfy the required "Check job status".
            echo "No-op run; nothing to verify."
            ;;
          esac

          [[ "$status" == "success" ]]
