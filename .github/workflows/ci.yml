# Note: This name is referred to in the nightly workflow, so make sure any
# changes are sync'd up!
name: "CI"

# One of three single-purpose workflows:
#   ci-trigger.yml : turns /test comments into ci:triggered label events.
#   ci-preflight.yml : fires on labeled/push, decides whether to build, and
#                      workflow_dispatch-fires this file when it should. That
#                      keeps stale check-run entries off PRs when unrelated
#                      labels are added (#10230).
#   ci.yml (this)    : builds wheels + dispatches FlexCI post-merge. Fires only
#                      via workflow_dispatch from ci-preflight.
#   flexci.yml       : after a successful /test build run completes, dispatches
#                      FlexCI with the recorded request.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit SHA) to build."
        required: true
        type: string
      artifact_suffix:
        description: "Suffix keying the wheel artifact name."
        required: true
        type: string
      head_sha:
        description: "PR head SHA (== ref for push events)."
        required: true
        type: string
      pr_number:
        description: "PR number, or '0' for push."
        required: true
        type: string
      caller_event:
        description: "Original event that triggered ci-preflight: pull_request or push."
        required: true
        type: string

concurrency:
  # PR builds: a fresh /test supersedes the previous. Push builds: per-commit
  # (no cancel -- each merge carries its own FlexCI dispatch).
  group: ${{ inputs.caller_event == 'push' && format('ci-push-{0}', inputs.head_sha) || format('ci-build-{0}', inputs.pr_number) }}
  cancel-in-progress: ${{ inputs.caller_event == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-vars:
    if: github.repository_owner == 'cupy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      CUDA_BUILD_VER: ${{ steps.get-vars.outputs.cuda_build_ver }}
      CUDA_PREV_BUILD_VER: ${{ steps.get-vars.outputs.cuda_prev_build_ver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - name: Get CUDA build versions
        id: get-vars
        run: |
          cuda_build_ver=$(yq '.cuda.build.version' ci/versions.yml)
          echo "cuda_build_ver=$cuda_build_ver" >> $GITHUB_OUTPUT

          cuda_prev_build_ver=$(yq '.cuda.prev_build.version' ci/versions.yml)
          echo "cuda_prev_build_ver=$cuda_prev_build_ver" >> $GITHUB_OUTPUT

  # Producer of cupy-<version>.tar.gz for every wheel job below. Building
  # wheels from the sdist (instead of a fresh checkout) makes the sdist the
  # single source of truth for what ships to PyPI -- any MANIFEST.in gap
  # fails this CI job, not a downstream user. Also eliminates the Windows
  # vendored-submodule symlink handling (the sdist has real files).
  build-sdist:
    if: github.repository_owner == 'cupy'
    permissions:
      contents: read
    name: Build sdist
    uses: ./.github/workflows/build-sdist.yml
    with:
      ref: ${{ inputs.ref }}
      artifact-suffix: ${{ inputs.artifact_suffix }}

  # NOTE: Build jobs are intentionally split by platform rather than using a
  # single matrix. This allows each test job to depend only on its
  # corresponding build, so faster platforms can proceed through build & test
  # without waiting for slower ones. Keep these job definitions textually
  # identical except for:
  #   - host-platform value
  # The reusable build workflow deliberately receives NO secrets: it needs
  # none (sccache uses the runner's ambient cache token), and labeled runs
  # of same-repo PRs would otherwise expose repository secrets to PR code.
  build-linux-64:
    needs:
      - ci-vars
      - build-sdist
    if: github.repository_owner == 'cupy'
    # Bounds the reusable build to a checkout-only token (no secrets, no writes).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - linux-64
        cuda-version:
          - ${{ needs.ci-vars.outputs.CUDA_BUILD_VER }}
          - ${{ needs.ci-vars.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ inputs.ref }}
      artifact-suffix: ${{ inputs.artifact_suffix }}

  # See build-linux-64 for why build jobs are split by platform.
  build-linux-aarch64:
    needs:
      - ci-vars
      - build-sdist
    if: github.repository_owner == 'cupy'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - linux-aarch64
        cuda-version:
          - ${{ needs.ci-vars.outputs.CUDA_BUILD_VER }}
          - ${{ needs.ci-vars.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ inputs.ref }}
      artifact-suffix: ${{ inputs.artifact_suffix }}

  # See build-linux-64 for why build jobs are split by platform.
  build-windows:
    needs:
      - ci-vars
      - build-sdist
    if: github.repository_owner == 'cupy'
    # Bounds the reusable build to a checkout-only token (no secrets, no writes).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host-platform:
          - win-64
        cuda-version:
          - ${{ needs.ci-vars.outputs.CUDA_BUILD_VER }}
          - ${{ needs.ci-vars.outputs.CUDA_PREV_BUILD_VER }}
    name: Build ${{ matrix.host-platform }}, CUDA ${{ matrix.cuda-version }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      host-platform: ${{ matrix.host-platform }}
      cuda-version: ${{ matrix.cuda-version }}
      ref: ${{ inputs.ref }}
      artifact-suffix: ${{ inputs.artifact_suffix }}

  # Liveness proof for flexci.yml: uploaded only when every build succeeded,
  # only on /test builds. It deliberately carries NO identity (the v3 plan
  # review showed identity via a PR-forgeable artifact reopens same-head
  # cross-wiring); flexci.yml derives the PR identity from trusted API
  # metadata instead. Overwrite keeps "re-run all jobs" viable (v4+
  # artifacts are otherwise immutable across attempts).
  build-sentinel:
    name: Upload build sentinel
    needs:
      - build-linux-64
      - build-linux-aarch64
      - build-windows
    if: inputs.caller_event == 'pull_request' && needs.build-linux-64.result == 'success' && needs.build-linux-aarch64.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create sentinel
        run: |
          mkdir -p "${RUNNER_TEMP}/sentinel"
          echo "built" > "${RUNNER_TEMP}/sentinel/built"
      - name: Upload sentinel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/sentinel/
          if-no-files-found: error
          overwrite: true

  # Post-merge dispatcher: push events are trusted (only merged/reviewed
  # code reaches these branches), carry secrets, and their payload is the
  # dispatcher's native push input -- so build and dispatch live in one run
  # with plain `needs:` ordering. The /test path dispatches from flexci.yml
  # instead (its build runs hold no secrets). Since ci.yml now fires via
  # workflow_dispatch, GITHUB_EVENT_PATH isn't the real push payload, so
  # we synthesize a minimal one for flexci_dispatcher.py -- same trick
  # ci-nightly.yml uses.
  dispatch-flexci:
    name: Dispatch FlexCI
    needs:
      - build-linux-64
      - build-linux-aarch64
      - build-windows
    if: inputs.caller_event == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read       # actions/checkout
      pull-requests: write  # flexci_dispatcher.py force-skip comments
      statuses: write       # flexci_dispatcher.py commit statuses
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup Environment
        run: pip install pygithub

      - name: Build synthetic push payload
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg sha "${HEAD_SHA}" \
            --arg url "${RUN_URL}" \
            --arg ts "${TIMESTAMP}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '{
              ref: "refs/heads/main",
              after: $sha,
              head_commit: {
                id: $sha,
                message: "Post-merge CI: dispatch FlexCI for pushed commit",
                url: $url,
                timestamp: $ts
              },
              repository: { full_name: $repo },
              sender: { login: "github-actions[bot]" }
            }' > payload.json
          cat payload.json

      - name: Dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEXCI_WEBHOOK_SECRET: ${{ secrets.FLEXCI_WEBHOOK_SECRET }}
        run: |
          ./.github/workflows/scripts/flexci_dispatcher.py \
              --event push \
              --webhook payload.json \
              --projects ".pfnci/config.tags.json" \
              --external-tag jenkins \
              --external-tag rocm

  checks:
    name: Check job status
    if: always() && github.repository_owner == 'cupy'
    runs-on: ubuntu-latest
    needs:
      - build-linux-64
      - build-linux-aarch64
      - build-windows
      - build-sentinel
      - dispatch-flexci
    steps:
      - name: Exit
        run: |
          status="success"
          check_result() {
            name=$1; expected=$2; result=$3
            echo "Checking $name: result='$result' (expected '$expected')"
            if [[ "$result" != "$expected" ]]; then
              echo "::error::$name did not match expected result"
              status="failed"
            fi
          }

          check_result "build-linux-64"      "success" "${{ needs.build-linux-64.result }}"
          check_result "build-linux-aarch64" "success" "${{ needs.build-linux-aarch64.result }}"
          check_result "build-windows"       "success" "${{ needs.build-windows.result }}"
          case "${{ inputs.caller_event }}" in
          pull_request)
            check_result "build-sentinel"  "success" "${{ needs.build-sentinel.result }}"
            check_result "dispatch-flexci" "skipped" "${{ needs.dispatch-flexci.result }}"
            ;;
          push)
            check_result "build-sentinel"  "skipped" "${{ needs.build-sentinel.result }}"
            check_result "dispatch-flexci" "success" "${{ needs.dispatch-flexci.result }}"
            ;;
          esac

          [[ "$status" == "success" ]]
