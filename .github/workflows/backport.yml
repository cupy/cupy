name: "Backport"

on:
  pull_request_target:
    types: [closed, labeled]
    branches:
       - main

jobs:
  backport:
    if: |
        github.repository_owner == 'cupy' &&
        github.event.pull_request.merged == true &&
        (
            (github.event.action == 'closed'  && contains(github.event.pull_request.labels.*.name, 'to-be-backported')) ||
            (github.event.action == 'labeled' && github.event.label.name == 'to-be-backported')
        )
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: 'cupy/backport'

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    # No cupy/cupy checkout here, so the pip hardening is inlined rather than
    # using ./.github/actions/harden-pip. Keep the URL in sync with that action.
    - name: Install Dependencies
      run: |
        python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        pip install pygithub

    # TODO(leofang): the backport bot (cupy/backport) copies the source PR's
    # labels onto the backport PR, so ci:triggered leaks over and immediately
    # triggers CI on the fresh backport PR. Strip it from the source PR here,
    # before the bot reads the labels (same workflow, so no race with
    # ci-trigger.yml). Move this elsewhere when this workflow is retired.
    - name: Strip ci:triggered before backporting
      env:
        GH_TOKEN: ${{ secrets.BACKPORT_TOKEN }}
      run: |
        gh api --method DELETE \
          "repos/${{ github.repository }}/issues/${{ github.event.number }}/labels/ci:triggered" || true

    - name: Run Backport
      env:
        GH_TOKEN: ${{secrets.BACKPORT_TOKEN}}
        BACKPORT_GITHUB_TOKEN: ${{secrets.BACKPORT_TOKEN}}
      run: |
        git config --global user.name "CuPy Automatic Backport"
        git config --global user.email "33715081+chainer-ci@users.noreply.github.com"
        gh auth setup-git
        python backport.py --repo cupy --pr ${{github.event.number}} --https --bot
